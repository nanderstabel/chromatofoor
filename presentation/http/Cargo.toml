utoipa = { version = "5.0", features = ["axum_extras"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
