[package]
name = "chromatofoor-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
http = ["dep:axum", "dep:chromatofoor-http", "dep:tokio-stream"]
axum = ["http"]

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", optional = true }
chromatofoor.workspace = true
chromatofoor-http = { workspace = true, optional = true }
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1.18", features = ["sync"], optional = true }
tracing.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
