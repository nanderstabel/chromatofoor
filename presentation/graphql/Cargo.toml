[package]
name = "chromatofoor-graphql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-graphql = { version = "~7.0.0", features = ["dynamic-schema"] }
async-graphql-axum = { version = "~7.0.0", optional = true }
async-stream = "0.3"
axum = { version = "0.8", optional = true }
chromatofoor.workspace = true
chromatofoor-http = { workspace = true, optional = true }
convert_case = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1.18", optional = true }
tracing.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[features]
default = []
http = ["dep:axum", "dep:async-graphql-axum", "dep:chromatofoor-http", "dep:tokio-stream"]
axum = ["http"]
