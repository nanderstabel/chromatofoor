[package]
name = "chromatofoor-graphql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-graphql = { version = "~7.0.0", default-features = false, features = ["dynamic-schema"] }
async-graphql-axum = { version = "~7.0.0", default-features = false, optional = true }
async-stream = "0.3"
axum = { version = "0.8", default-features = false, optional = true }
chromatofoor.workspace = true
chromatofoor-http = { workspace = true, optional = true }
convert_case = { version = "0.6", default-features = false }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1.18", default-features = false, optional = true }
tracing.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true

[features]
default = []
http = ["dep:axum", "dep:async-graphql-axum", "dep:chromatofoor-http", "dep:tokio-stream", "async-graphql/graphiql"]
axum = ["http"]
