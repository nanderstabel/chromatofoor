[package]
name = "chromatofoor-gen"
edition.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["tui"]
full = ["tui", "http", "graphql", "mcp", "tauri", "typescript"]
tauri = ["typescript"]
tui = []
http = []
graphql = []
mcp = []
typescript = []

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.1", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
esdm.workspace = true
convert_case = { version = "0.11.0", default-features = false }
proc-macro2 = "1.0.106"
quote = "1.0.46"
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json.workspace = true
serde_yaml = "0.9.34"
indexmap = { version = "2.2", default-features = false, features = ["std", "serde"] }
syn = { version = "2.0", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "proc-macro"] }
prettyplease = "0.2"
pathdiff = "0.2.3"

[dev-dependencies]
insta = { version = "1.39.0", default-features = false, features = ["yaml"] }
tempfile = "3.10.1"

[lints]
workspace = true
