[workspace]
resolver = "2"
members = [
    "chromatofoor",
    "chromatofoor-derive",
    "chromatofoor-gen",
    "esdm",
    "presentation/graphql",
    "presentation/http",
    "presentation/mcp",
    "presentation/tauri",
    "presentation/tui",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/nanderstabel/chromatofoor"
rust-version = "1.95"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unknown_lints = "allow"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
implicit_hasher = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
enum_variant_names = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
unused_self = "allow"
manual_let_else = "allow"
single_match_else = "allow"
option_if_let_else = "allow"
match_wildcard_for_single_variants = "allow"
unnecessary_debug_formatting = "allow"
needless_pass_by_value = "allow"
assigning_clones = "allow"
format_push_string = "allow"
used_underscore_binding = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"
match_same_arms = "allow"
ref_option = "allow"

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
chromatofoor = { path = "chromatofoor" }
constcat = "0.6"
esdm = { path = "esdm" }
nutype = { version = "0.6", default-features = false, features = ["serde"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
tokio = { version = "1.0", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
validator = { version = "0.19", default-features = false, features = ["derive"] }
chromatofoor-http = { path = "presentation/http" }
uuid = { version = "1.4", default-features = false, features = ["std"] }

[profile.dev.package."*"]
debug = false
