[package]
name = "esdm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
openapi = ["dep:utoipa", "dep:serde_json"]
jsonschema = ["dep:schemars"]
typescript = []

[dependencies]
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_yaml = "0.9"
indexmap = { version = "2.2", default-features = false, features = ["std", "serde"] }

# Optional dependencies for translation features
serde_json = { workspace = true, optional = true }
utoipa = { version = "5.0", optional = true }
schemars = { version = "0.8", default-features = false, optional = true }

[lints]
workspace = true
