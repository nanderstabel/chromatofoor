apiVersion: schema.esdm.io/core/v1
kind: process-manager
name: booking-saga
description: Coordinates flight booking and payment
scope:
  domain: travel
deliveryGuarantee: at-least-once
idempotency:
  owner: self
  strategy: deterministic-hash
correlatedBy:
  source: event-field
  field: booking-id
state:
  type: object
  properties:
    booking-id:
      type: string
      format: identifier
    flight-id:
      type: string
      format: identifier
    amount:
      type: integer
    status:
      type: string
  required:
  - booking-id
  - flight-id
  - amount
  - status
timers:
- name: payment-timeout
  description: Timeout if payment isn't processed in time
  after:
    value: 1
    unit: minutes
startsWhen:
- boundedContext: booking
  aggregate: booking
  event: booking-initialized
endsWhen:
- name: confirmed
  condition: status is Confirmed
- name: failed
  condition: status is Failed
reactions:
- when:
    boundedContext: booking
    aggregate: booking
    event: booking-initialized
  rule: When a booking is initialized, request a seat reservation
  emits:
  - boundedContext: booking
    aggregate: flight
    command: reserve-seat
- when:
    boundedContext: booking
    aggregate: flight
    event: seat-reserved
  rule: When seat is reserved, process the payment and set a timeout
  emits:
  - boundedContext: booking
    aggregate: payment
    command: process-payment
  - boundedContext: scheduler
    aggregate: timer
    command: schedule-timeout
  setTimers:
  - payment-timeout
- when:
    boundedContext: booking
    aggregate: flight
    event: seat-reservation-failed
  rule: When seat reservation fails, fail the booking
  emits:
  - boundedContext: booking
    aggregate: booking
    command: fail-booking
- when:
    boundedContext: booking
    aggregate: payment
    event: payment-processed
  rule: When payment succeeds, confirm the booking and clear timeout
  emits:
  - boundedContext: booking
    aggregate: booking
    command: confirm-booking
  cancelTimers:
  - payment-timeout
- when:
    boundedContext: booking
    aggregate: payment
    event: payment-failed
  rule: When payment fails, release the seat and fail the booking and clear timeout
  emits:
  - boundedContext: booking
    aggregate: flight
    command: release-seat
  - boundedContext: booking
    aggregate: booking
    command: fail-booking
  cancelTimers:
  - payment-timeout
- when:
    timer: payment-timeout
  rule: If payment times out, release seat and fail booking
  emits:
  - boundedContext: booking
    aggregate: flight
    command: release-seat
  - boundedContext: booking
    aggregate: booking
    command: fail-booking
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: booking-details
description: Observability view tracking booking process status over time
scope:
  domain: travel
  boundedContext: booking
schema:
  type: object
  properties:
    booking-id:
      type: string
    flight-id:
      type: string
    amount:
      type: integer
    status:
      type: string
    reason:
      type: string
  required:
  - booking-id
  - status
projections:
- boundedContext: booking
  aggregate: booking
  event: booking-initialized
  rule: >
    UPSERT WITH
    booking-id = event.booking-id,
    flight-id = event.flight-id,
    amount = event.amount,
    status = "Pending"
- boundedContext: booking
  aggregate: booking
  event: booking-confirmed
  rule: >
    UPDATE WITH
    status = "Confirmed"
- boundedContext: booking
  aggregate: booking
  event: booking-failed
  rule: >
    UPDATE WITH
    status = "Failed",
    reason = event.reason
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: flight-details
description: Observability view tracking flight seat inventory
scope:
  domain: travel
  boundedContext: booking
schema:
  type: object
  properties:
    flight-id:
      type: string
    total-seats:
      type: integer
    reserved-seats:
      type: integer
    available-seats:
      type: integer
  required:
  - flight-id
  - total-seats
  - reserved-seats
  - available-seats
projections:
- boundedContext: booking
  aggregate: flight
  event: flight-added
  rule: >
    UPSERT WITH
    flight-id = event.flight-id,
    total-seats = event.total-seats,
    reserved-seats = 0,
    available-seats = event.total-seats
- boundedContext: booking
  aggregate: flight
  event: seat-reserved
  rule: >
    UPDATE WITH
    reserved-seats = reserved-seats + 1,
    available-seats = available-seats - 1
- boundedContext: booking
  aggregate: flight
  event: seat-released
  rule: >
    UPDATE WITH
    reserved-seats = reserved-seats - 1,
    available-seats = available-seats + 1
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: payment-details
description: Observability view tracking payment status
scope:
  domain: travel
  boundedContext: booking
schema:
  type: object
  properties:
    booking-id:
      type: string
    amount:
      type: integer
    status:
      type: string
    reason:
      type: string
  required:
  - booking-id
  - amount
  - status
projections:
- boundedContext: booking
  aggregate: payment
  event: payment-initiated
  rule: >
    UPSERT WITH
    booking-id = event.booking-id,
    amount = event.amount,
    status = "Initiated"
- boundedContext: booking
  aggregate: payment
  event: payment-processed
  rule: >
    UPSERT WITH
    booking-id = event.booking-id,
    amount = event.amount,
    status = "Processed"
- boundedContext: booking
  aggregate: payment
  event: payment-failed
  rule: >
    UPSERT WITH
    booking-id = event.booking-id,
    amount = 0,
    status = "Failed",
    reason = event.reason
---
