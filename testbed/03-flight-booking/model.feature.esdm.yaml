apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: booking-details-read-model
description: Tests for the booking-details read model projection.
scope:
  domain: travel
  boundedContext: booking
  readModel: booking-details
scenarios:
  - name: verify-booking-initialized-projection
    description: When a booking is initialized, the read model sets status to Pending.
    given:
      - boundedContext: booking
        aggregate: booking
        event: booking-initialized
        data:
          booking-id: "BK1"
          flight-id: "FL123"
          amount: 500
    when:
      query: get-booking-details
      parameters: {}
    then:
      readModel:
        booking_id: "BK1"
        flight_id: "FL123"
        amount: 500
        status: "Pending"

  - name: verify-booking-confirmed-projection
    description: When a booking is confirmed, the read model updates to Confirmed.
    given:
      - boundedContext: booking
        aggregate: booking
        event: booking-initialized
        data:
          booking-id: "BK1"
          flight-id: "FL123"
          amount: 500
      - boundedContext: booking
        aggregate: booking
        event: booking-confirmed
        data:
          booking-id: "BK1"
    when:
      query: get-booking-details
      parameters: {}
    then:
      readModel:
        booking_id: "BK1"
        flight_id: "FL123"
        amount: 500
        status: "Confirmed"

  - name: verify-booking-failed-projection
    description: When a booking fails, the read model updates to Failed with reason.
    given:
      - boundedContext: booking
        aggregate: booking
        event: booking-initialized
        data:
          booking-id: "BK1"
          flight-id: "FL123"
          amount: 500
      - boundedContext: booking
        aggregate: booking
        event: booking-failed
        data:
          booking-id: "BK1"
          reason: "Payment failed"
    when:
      query: get-booking-details
      parameters: {}
    then:
      readModel:
        booking_id: "BK1"
        flight_id: "FL123"
        amount: 500
        status: "Failed"
        reason: "Payment failed"

