apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: payment-aggregate
scope:
  domain: travel
  boundedContext: booking
  aggregate: payment
scenarios:
  - name: process-payment-initiated
    description: "Process payment initiated"
    given: []
    when:
      command: process-payment
      data:
        booking-id: "BK1"
        flight-id: "FL123"
        amount: 500
    then:
      events:
        - event: payment-initiated
          data:
            booking-id: "BK1"
            flight-id: "FL123"
            amount: 500

  - name: complete-payment-success
    description: "Complete payment successfully"
    given:
      - event: payment-initiated
        data:
          booking-id: "BK1"
          flight-id: "FL123"
          amount: 500
    when:
      command: complete-payment
      data:
        booking-id: "BK1"
        flight-id: "FL123"
        amount: 500
        success: true
    then:
      events:
        - event: payment-processed
          data:
            booking-id: "BK1"
            flight-id: "FL123"
            amount: 500

  - name: complete-payment-failed
    description: "Complete payment failure"
    given:
      - event: payment-initiated
        data:
          booking-id: "BK1"
          flight-id: "FL123"
          amount: 500
    when:
      command: complete-payment
      data:
        booking-id: "BK1"
        flight-id: "FL123"
        amount: 500
        success: false
    then:
      events:
        - event: payment-failed
          data:
            booking-id: "BK1"
            flight-id: "FL123"
            reason: "Payment declined by gateway"

---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: booking-saga-workflow
scope:
  domain: travel
  processManager: booking-saga
scenarios:
  - name: booking-initialized-reaction
    description: "When booking is initialized, emit reserve-seat"
    given: []
    when:
      boundedContext: booking
      aggregate: booking
      event: booking-initialized
      data:
        booking-id: "BK1"
        flight-id: "FL123"
        amount: 500
    then:
      emits:
        - boundedContext: booking
          aggregate: flight
          command: reserve-seat
          data:
            booking-id: "BK1"
            flight-id: "FL123"

      state:
        booking-id: "BK1"
        flight-id: "FL123"
        amount: 500
        status: "ReservingSeat"

  - name: payment-timeout-reaction
    description: "When payment-timeout fires after seat reservation, release seat and fail booking"
    given:
      - boundedContext: booking
        aggregate: booking
        event: booking-initialized
        data:
          booking-id: "BK1"
          flight-id: "FL123"
          amount: 500
      - boundedContext: booking
        aggregate: flight
        event: seat-reserved
        data:
          booking-id: "BK1"
          flight-id: "FL123"
    when:
      timer: payment-timeout
    then:
      emits:
        - boundedContext: booking
          aggregate: flight
          command: release-seat
          data:
            booking-id: "BK1"
            flight-id: "FL123"
        - boundedContext: booking
          aggregate: booking
          command: fail-booking
          data:
            booking-id: "BK1"
            reason: "Payment timed out"
      state:
        booking-id: "BK1"
        flight-id: "FL123"
        amount: 500
        status: "Failed"
      ended: true
