apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: booking-aggregate
scope:
  domain: travel
  boundedContext: booking
  aggregate: booking
scenarios:
  - name: initialize-booking
    description: "Initialize booking"
    given: []
    when:
      command: initialize-booking
      data:
        booking-id: "BK1"
        flight-id: "FL123"
        amount: 500
    then:
      events:
        - event: booking-initialized
          data:
            booking-id: "BK1"
            flight-id: "FL123"
            amount: 500

  - name: confirm-booking
    description: "Confirm booking"
    given:
      - event: booking-initialized
        data:
          booking-id: "BK1"
          flight-id: "FL123"
          amount: 500
    when:
      command: confirm-booking
      data:
        booking-id: "BK1"
    then:
      events:
        - event: booking-confirmed
          data:
            booking-id: "BK1"

  - name: fail-booking
    description: "Fail booking"
    given:
      - event: booking-initialized
        data:
          booking-id: "BK1"
          flight-id: "FL123"
          amount: 500
    when:
      command: fail-booking
      data:
        booking-id: "BK1"
        reason: "Payment failed"
    then:
      events:
        - event: booking-failed
          data:
            booking-id: "BK1"
            reason: "Payment failed"

  - name: confirm-failed-booking
    description: "Cannot confirm a booking that has already failed"
    given:
      - event: booking-initialized
        data:
          booking-id: "BK1"
          flight-id: "FL123"
          amount: 500
      - event: booking-failed
        data:
          booking-id: "BK1"
          reason: "Payment failed"
    when:
      command: confirm-booking
      data:
        booking-id: "BK1"
    then:
      rejection:
        reason: "Cannot confirm booking because it is in state: Failed"

  - name: fail-confirmed-booking
    description: "Cannot fail a booking that is already confirmed"
    given:
      - event: booking-initialized
        data:
          booking-id: "BK1"
          flight-id: "FL123"
          amount: 500
      - event: booking-confirmed
        data:
          booking-id: "BK1"
    when:
      command: fail-booking
      data:
        booking-id: "BK1"
        reason: "Late payment failure"
    then:
      rejection:
        reason: "Cannot fail booking because it is in state: Confirmed"

---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: flight-aggregate
scope:
  domain: travel
  boundedContext: booking
  aggregate: flight
scenarios:
  - name: add-flight
    description: "Add a flight"
    given: []
    when:
      command: add-flight
      data:
        total-seats: 100
        flight-id: "FL123"
    then:
      events:
        - event: flight-added
          data:
            total-seats: 100
            flight-id: "FL123"

  - name: reserve-seat-not-found
    description: "Cannot reserve a seat if the flight does not exist"
    given: []
    when:
      command: reserve-seat
      data:
        booking-id: "BK1"
        flight-id: "FL123"
    then:
      rejection:
        reason: "Flight does not exist"

  - name: reserve-seat-success
    description: "Reserve seat successfully"
    given:
      - event: flight-added
        data:
          total-seats: 100
          flight-id: "FL123"
    when:
      command: reserve-seat
      data:
        booking-id: "BK1"
        flight-id: "FL123"
    then:
      events:
        - event: seat-reserved
          data:
            booking-id: "BK1"
            flight-id: "FL123"

  - name: reserve-seat-failed
    description: "Reserve seat failed because full"
    given:
      - event: flight-added
        data:
          total-seats: 0
          flight-id: "FL123"
    when:
      command: reserve-seat
      data:
        booking-id: "BK1"
        flight-id: "FL123"
    then:
      events:
        - event: seat-reservation-failed
          data:
            booking-id: "BK1"
            flight-id: "FL123"

  - name: release-seat
    description: "Release reserved seat"
    given:
      - event: flight-added
        data:
          total-seats: 100
          flight-id: "FL123"
      - event: seat-reserved
        data:
          booking-id: "BK1"
          flight-id: "FL123"
    when:
      command: release-seat
      data:
        booking-id: "BK1"
        flight-id: "FL123"
    then:
      events:
        - event: seat-released
          data:
            booking-id: "BK1"

