apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: open-ticket
description: Customers can open support tickets if the content is clean.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
  aggregate: ticket
scenarios:
  - name: opening-a-clean-ticket
    given: []
    when:
      command: open-ticket
      data:
        ticket-id: 11110000-0000-0000-0000-000000000001
        customer-email: "test@example.com"
        subject: "Login issue"
        initial-message: "I cannot login to my account."
    then:
      events:
        - event: ticket-opened
          data:
            ticket-id: 11110000-0000-0000-0000-000000000001
            customer-email: "test@example.com"
            subject: "Login issue"
        - event: message-added
          data:
            ticket-id: 11110000-0000-0000-0000-000000000001
            message-id: 22220000-0000-0000-0000-000000000001
            content: "I cannot login to my account."
            author-email: "test@example.com"
  - name: opening-a-ticket-with-profanity
    given: []
    when:
      command: open-ticket
      data:
        ticket-id: 11110000-0000-0000-0000-000000000001
        customer-email: "test@example.com"
        subject: "Login issue"
        initial-message: "This app is terrible and I hate it." # Assume filter catches this
    then:
      rejection:
        reason: "Profanity detected in the message"
---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: assign-ticket
description: Agents can be assigned to tickets subject to workload limits.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
  aggregate: ticket
scenarios:
  - name: assigning-a-ticket
    given:
      - event: ticket-opened
        data:
          ticket-id: 11110000-0000-0000-0000-000000000001
          customer-email: "test@example.com"
          subject: "Login issue"
    when:
      command: assign-ticket
      data:
        ticket-id: 11110000-0000-0000-0000-000000000001
        agent-id: 33330000-0000-0000-0000-000000000001
    then:
      events:
        - event: ticket-assigned
          data:
            ticket-id: 11110000-0000-0000-0000-000000000001
            agent-id: 33330000-0000-0000-0000-000000000001
  - name: assigning-a-ticket-to-overworked-agent
    given:
      - event: ticket-opened
        data:
          ticket-id: 11110000-0000-0000-0000-000000000001
          customer-email: "test@example.com"
          subject: "Login issue"
    when:
      command: assign-ticket
      data:
        ticket-id: 11110000-0000-0000-0000-000000000001
        agent-id: 44440000-0000-0000-0000-000000000001 # Assume this agent has 5 tickets
    then:
      rejection:
        reason: "Agent has reached the maximum workload limit"

