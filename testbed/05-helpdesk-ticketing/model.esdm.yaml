apiVersion: schema.esdm.io/core/v1
kind: domain
name: helpdesk-ticketing
description: A domain for managing helpdesk support tickets.
---
apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: ticketing
description: Bounded context for managing tickets and messages.
scope:
  domain: helpdesk-ticketing
---
apiVersion: schema.esdm.io/core/v1
kind: value-object
name: email-address
description: A validated email address.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
schema:
  type: object
  properties:
    value:
      type: string
  required: [value]
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: customer
description: A customer requesting support.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
type: human
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: support-agent
description: An agent providing support.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
type: human
---
apiVersion: schema.esdm.io/core/v1
kind: entity
name: message
description: A message within a ticket.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
identifiedBy:
  source: schema
  field: message-id
schema:
  type: object
  properties:
    message-id:
      type: string
      format: uuid
    content:
      type: string
    author-email:
      type: object # Maps to the value-object
      properties:
        value:
          type: string
      required: [value]
  required: [message-id, content, author-email]

---
apiVersion: schema.esdm.io/core/v1
kind: domain-service
name: profanity-filter
description: Service that filters bad language.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
functions:
  - name: check-content
    description: Checks if the content is clean.
    arguments:
      type: object
      properties:
        content:
          type: string
      required: [content]
    returns:
      type: object
      properties:
        is-clean:
          type: boolean
      required: [is-clean]
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: agent-workload
description: Enforces that an agent does not exceed a maximum number of open tickets.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
identifiedBy:
  - name: agent-id
    source: command-payload
    field: agent-id
consults:
  - boundedContext: ticketing
    aggregate: ticket
    event: ticket-assigned
    criteria: "All ticket-assigned events for the agent."
  - boundedContext: ticketing
    aggregate: ticket
    event: ticket-resolved
    criteria: "All ticket-resolved events for tickets assigned to the agent."
---
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: ticket
description: A support ticket.
identifiedBy:
  source: state
  field: ticket-id
state:
  type: object
  properties:
    ticket-id:
      type: string
      format: uuid
  required:
    - ticket-id
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: open-ticket
description: Opens a new ticket.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
  aggregate: ticket
data:
  type: object
  properties:
    ticket-id:
      type: string
      format: uuid
    customer-email:
      type: string
    subject:
      type: string
    initial-message:
      type: string
  required: [ticket-id, customer-email, subject, initial-message]
publishes:
  - ticket-opened
  - message-added
actors:
  - customer
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: ticket-opened
description: Emitted when a ticket is opened.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
  aggregate: ticket
data:
  type: object
  properties:
    ticket-id:
      type: string
      format: uuid
    customer-email:
      type: string
    subject:
      type: string
  required: [ticket-id, customer-email, subject]
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: message-added
description: Emitted when a message is added to a ticket.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
  aggregate: ticket
data:
  type: object
  properties:
    ticket-id:
      type: string
      format: uuid
    message-id:
      type: string
      format: uuid
    content:
      type: string
    author-email:
      type: string
  required: [ticket-id, message-id, content, author-email]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: assign-ticket
description: Assigns an agent to a ticket.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
  aggregate: ticket
data:
  type: object
  properties:
    ticket-id:
      type: string
      format: uuid
    agent-id:
      type: string
      format: uuid
  required: [ticket-id, agent-id]
actors:
  - support-agent
publishes:
  - ticket-assigned
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: ticket-assigned
description: Emitted when a ticket is assigned to an agent.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
  aggregate: ticket
data:
  type: object
  properties:
    ticket-id:
      type: string
      format: uuid
    agent-id:
      type: string
      format: uuid
  required: [ticket-id, agent-id]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: resolve-ticket
description: Resolves the ticket.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
  aggregate: ticket
data:
  type: object
  properties:
    ticket-id:
      type: string
      format: uuid
  required: [ticket-id]
actors:
  - support-agent
publishes:
  - ticket-resolved
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: ticket-resolved
description: Emitted when a ticket is resolved.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
  aggregate: ticket
data:
  type: object
  properties:
    ticket-id:
      type: string
      format: uuid
  required: [ticket-id]
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: ticket-backlog
description: Tracks open tickets.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
schema:
  type: object
  properties:
    tickets:
      type: array
      items:
        type: object
        properties:
          ticketId:
            type: string
            format: uuid
          subject:
            type: string
projections:
  - boundedContext: ticketing
    aggregate: ticket
    event: ticket-opened
    rule: "TODO"
  - boundedContext: ticketing
    aggregate: ticket
    event: message-added
    rule: "TODO"
---
apiVersion: schema.esdm.io/core/v1
kind: query
name: get-ticket-backlog
description: Retrieves the ticket backlog.
scope:
  domain: helpdesk-ticketing
  boundedContext: ticketing
readModel: ticket-backlog
paradigm: document
result:
  type: object
parameters:
  type: object
actors:
  - support-agent
constraints: []
