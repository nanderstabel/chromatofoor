apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: shopping-cart-commands
description: Behavioral scenarios for initializing, adding items to, and checking out a shopping cart.
scope:
  domain: ecommerce-example
  boundedContext: sales
  aggregate: shopping-cart
scenarios:
  - name: initialize-new-cart
    description: Initializing a cart emits cart-initialized.
    given: []
    when:
      actor: customer
      command: initialize-cart
      data:
        customer-id: "cust-101"
    then:
      events:
        - event: cart-initialized
          data:
            customer-id: "cust-101"

  - name: add-valid-item-to-cart
    description: Adding a valid cart item emits item-added-to-cart.
    given:
      - event: cart-initialized
        data:
          customer-id: "cust-101"
    when:
      actor: customer
      command: add-item-to-cart
      data:
        id: "00000000-0000-0000-0000-000000000001"
        item:
          sku: "book-ddd-blue"
          quantity: 2
          unit-price: 4500
    then:
      events:
        - event: item-added-to-cart
          data:
            item:
              sku: "book-ddd-blue"
              quantity: 2
              unit-price: 4500

  - name: checkout-populated-cart
    description: Checking out a cart containing items emits cart-checked-out.
    given:
      - event: cart-initialized
        data:
          customer-id: "cust-101"
      - event: item-added-to-cart
        data:
          item:
            sku: "book-ddd-blue"
            quantity: 2
            unit-price: 4500
    when:
      actor: customer
      command: checkout-cart
      data:
        id: "00000000-0000-0000-0000-000000000001"
        shipping-address:
          street: "Keizersgracht 120"
          postal-code: "1015CW"
          country-code: "NL"
    then:
      events:
        - event: cart-checked-out
          data:
            shipping-address:
              street: "Keizersgracht 120"
              postal-code: "1015CW"
              country-code: "NL"

  - name: reject-empty-cart-checkout
    description: Checking out a cart with zero items fails with empty-cart.
    given:
      - event: cart-initialized
        data:
          customer-id: "cust-101"
    when:
      actor: customer
      command: checkout-cart
      data:
        id: "00000000-0000-0000-0000-000000000001"
        shipping-address:
          street: "Keizersgracht 120"
          postal-code: "1015CW"
          country-code: "NL"
    then:
      rejection:
        invariant: empty-cart

  - name: reject-item-addition-after-checkout
    description: Adding an item after checkout fails with cart-already-checked-out.
    given:
      - event: cart-initialized
        data:
          customer-id: "cust-101"
      - event: item-added-to-cart
        data:
          item:
            sku: "book-ddd-blue"
            quantity: 1
            unit-price: 4500
      - event: cart-checked-out
        data:
          shipping-address:
            street: "Keizersgracht 120"
            postal-code: "1015CW"
            country-code: "NL"
    when:
      actor: customer
      command: add-item-to-cart
      data:
        id: "00000000-0000-0000-0000-000000000001"
        item:
          sku: "book-ddd-red"
          quantity: 1
          unit-price: 5000
    then:
      rejection:
        invariant: cart-already-checked-out

  - name: reject-invalid-item-quantity
    description: Nested entity validation rejects item quantity outside 1..=99 before decide runs.
    given:
      - event: cart-initialized
        data:
          customer-id: "cust-101"
    when:
      actor: customer
      command: add-item-to-cart
      data:
        id: "00000000-0000-0000-0000-000000000001"
        item:
          sku: "book-ddd-blue"
          quantity: 0
          unit-price: 4500
    then:
      rejection:
        reason: "must be between 1 and 99"
---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: cart-summary-queries
description: Read-model query scenarios for shopping cart totals and checkout status.
scope:
  domain: ecommerce-example
  boundedContext: sales
  readModel: cart-summary
scenarios:
  - name: return-projected-cart-totals
    description: Querying get-cart-summary returns total_amount, item_count, and CheckedOut status.
    given:
      - boundedContext: sales
        aggregate: shopping-cart
        event: cart-initialized
        data:
          customer-id: "cust-101"
      - boundedContext: sales
        aggregate: shopping-cart
        event: item-added-to-cart
        data:
          item:
            sku: "book-ddd-blue"
            quantity: 2
            unit-price: 4500
      - boundedContext: sales
        aggregate: shopping-cart
        event: cart-checked-out
        data:
          shipping-address:
            street: "Keizersgracht 120"
            postal-code: "1015CW"
            country-code: "NL"
    when:
      query: get-cart-summary
      parameters:
        id: "00000000-0000-0000-0000-000000000001"
    then:
      result:
        total_amount: 9000
        item_count: 2
        status: "CheckedOut"
