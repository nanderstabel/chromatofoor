apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: openid-credential-issuer-metadata-binding
description: Exposes the OpenID4VCI Credential Issuer metadata document at the standard well-known discovery URI.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  query: get-template-catalog
transport: http-rest
rest:
  path: /.well-known/openid-credential-issuer
  method: GET
  successStatus: 200
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: openid4vci-credential-binding
description: Accepts credential requests with cryptographic holder binding proof as specified in OID4VCI section 7.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  command: issue-credential
transport: http-rest
rest:
  path: /credential
  method: POST
  successStatus: 200
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: openid4vci-offer-binding
description: Initiates an OID4VCI issuance session and creates a credential offer for a holder.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  command: create-offer
transport: http-rest
rest:
  path: /credential-offers
  method: POST
  successStatus: 201
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: token-status-list-binding
description: Serves the IETF Token Status List bitstring for high-performance credential revocation checking.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  query: get-status-lists
transport: http-rest
rest:
  path: /status-lists
  method: GET
  successStatus: 200
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: domain-linkage-config-binding
description: Serves the domain linkage credential set proving ownership between did:web and this internet domain.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  query: get-verified-domains
transport: http-rest
rest:
  path: /.well-known/did-configuration.json
  method: GET
  successStatus: 200
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: organization-did-document-binding
description: Serves the primary did:web resolution document containing public verification keys.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  query: get-active-keys
transport: http-rest
rest:
  path: /.well-known/did.json
  method: GET
  successStatus: 200
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: webfinger-discovery-binding
description: Provides RFC 7033 WebFinger discovery linking resource handles to the organization DID and profile.
scope:
  domain: digital-identity-ecosystem
  boundedContext: peer-network
  query: get-organization-profile
transport: http-rest
rest:
  path: /.well-known/webfinger
  method: GET
  successStatus: 200
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: openid-federation-entity-configuration-binding
description: Serves the signed OpenID Federation 1.0 entity statement for trust chain establishment.
scope:
  domain: digital-identity-ecosystem
  boundedContext: open-federation
  query: get-federation-directory
transport: http-rest
rest:
  path: /.well-known/openid-federation
  method: GET
  successStatus: 200
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: openid4vp-verify-presentation-binding
description: Receives verifiable presentations and validates cryptographic proofs and revocation status.
scope:
  domain: digital-identity-ecosystem
  boundedContext: verification-service
  command: verify-presentation
transport: http-rest
rest:
  path: /verify
  method: POST
  successStatus: 200
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: openid4vp-initiate-verification-binding
description: Creates a fresh verification session challenge with anti-replay nonce and requested claims.
scope:
  domain: digital-identity-ecosystem
  boundedContext: verification-service
  command: initiate-verification
transport: http-rest
rest:
  path: /verification-sessions
  method: POST
  successStatus: 201
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: wallet-cli-keygen-binding
description: Local command-line tool interface to generate a new cryptographic keypair in the identity wallet.
scope:
  domain: digital-identity-ecosystem
  boundedContext: identity-wallet
  command: generate-holder-key
transport: cli
cli:
  command: wallet
  subcommand: keygen
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: presentation-binding
name: wallet-cli-store-binding
description: Local command-line tool interface to inspect and manage credentials in the wallet vault.
scope:
  domain: digital-identity-ecosystem
  boundedContext: identity-wallet
  query: get-wallet-vault
transport: cli
cli:
  command: wallet
  subcommand: vault
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: event-store-binding
name: default-event-store
description: In-memory event store provider for local execution and integration testing of the ecosystem.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
provider: in-memory
---
apiVersion: schema.esdm.io/infrastructure/v1
kind: view-repository-binding
name: default-view-repository
description: In-memory view repository provider for read model projection storage.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
provider: in-memory
