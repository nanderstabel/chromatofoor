---
apiVersion: schema.esdm.io/core/v1
kind: domain
name: digital-identity-ecosystem
description: Decentralized digital identity ecosystem spanning enterprise SSI Agents, OpenID Federations, credential issuance, verification, and sovereign identity wallets.
---
# ==============================================================================
# Bounded Context 1: Organization Identity
# ==============================================================================
apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: organization-identity
description: Manages enterprise signing keys, cryptographic materials, did:web documents, and verifiable Domain Linkage.
scope:
  domain: digital-identity-ecosystem
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: organization-admin
description: Corporate identity administrator authorized to manage enterprise keys and domain configurations.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
type: human
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: public
description: Unauthenticated verifier, holder, or internet user resolving public DID documents and domain linkage.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
type: human
---
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: organization-keyring
description: Cryptographic keyring managing active, rotated, and revoked signing keypairs in the enterprise KMS.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
identifiedBy:
  source: generated
  generator: uuid
state:
  type: object
  properties:
    active-key-id:
      type: string
    algorithm:
      type: string
    status:
      type: string
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: generate-signing-key
description: Generates a new cryptographic keypair for did:web authentication and credential assertion.
actors: [organization-admin]
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  aggregate: organization-keyring
data:
  type: object
  properties:
    algorithm:
      type: string
    purpose:
      type: string
  required: [algorithm, purpose]
publishes:
  - signing-key-generated
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: signing-key-generated
description: Emitted when a new cryptographic keypair is generated and stored in the enterprise KMS.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  aggregate: organization-keyring
data:
  type: object
  properties:
    key-id:
      type: string
    algorithm:
      type: string
    public-key-jwk:
      type: string
  required: [key-id, algorithm, public-key-jwk]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: rotate-signing-key
description: Retires the active keypair and establishes a fresh keypair for subsequent assertions.
actors: [organization-admin]
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  aggregate: organization-keyring
data:
  type: object
  properties:
    id:
      type: string
      format: uuid
    new-algorithm:
      type: string
    reason:
      type: string
  required: [id, new-algorithm, reason]
publishes:
  - signing-key-rotated
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: signing-key-rotated
description: Emitted when an existing keypair is deactivated in favor of a newly generated keypair.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  aggregate: organization-keyring
data:
  type: object
  properties:
    previous-key-id:
      type: string
    new-key-id:
      type: string
  required: [previous-key-id, new-key-id]
---
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: domain-linkage
description: Manages the cryptographic binding between a DNS domain origin and an enterprise did:web identifier.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
identifiedBy:
  source: generated
  generator: uuid
state:
  type: object
  properties:
    domain-name:
      type: string
    did-web-uri:
      type: string
    is-verified:
      type: boolean
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: register-domain
description: Associates a DNS domain hostname with a target did:web identifier.
actors: [organization-admin]
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  aggregate: domain-linkage
data:
  type: object
  properties:
    domain-name:
      type: string
    did-web-uri:
      type: string
  required: [domain-name, did-web-uri]
publishes:
  - domain-registered
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: domain-registered
description: Emitted when an enterprise registers its domain for did:web and did-configuration publication.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  aggregate: domain-linkage
data:
  type: object
  properties:
    domain-name:
      type: string
    did-web-uri:
      type: string
  required: [domain-name, did-web-uri]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: verify-domain-linkage
description: Validates TLS and verifies the domain linkage credential hosted at /.well-known/did-configuration.json.
actors: [organization-admin]
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  aggregate: domain-linkage
data:
  type: object
  properties:
    id:
      type: string
      format: uuid
    tls-cert-fingerprint:
      type: string
  required: [id, tls-cert-fingerprint]
publishes:
  - linkage-verified
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: linkage-verified
description: Emitted when the domain linkage credential is authenticated against DNS and HTTPS origin.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  aggregate: domain-linkage
data:
  type: object
  properties:
    verified-at:
      type: string
  required: [verified-at]
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: active-organization-keys
description: Summary of active and historical cryptographic keys configured for the organization.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
schema:
  type: object
  properties:
    total-keys:
      type: integer
    active-key-id:
      type: string
projections:
  - boundedContext: organization-identity
    aggregate: organization-keyring
    event: signing-key-generated
    rule: Increment total-keys and record active-key-id.
  - boundedContext: organization-identity
    aggregate: organization-keyring
    event: signing-key-rotated
    rule: Update active-key-id to newly rotated key.
---
apiVersion: schema.esdm.io/core/v1
kind: query
name: get-active-keys
description: Queries current signing keys and their public JWK representations.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
readModel: active-organization-keys
paradigm: document
result:
  type: object
  properties:
    total-keys:
      type: integer
    active-key-id:
      type: string
parameters:
  type: object
  properties:
    filter-purpose:
      type: string
actors:
  - public
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: verified-domains
description: Summary of registered and verified DNS domain origins for did:web.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
schema:
  type: object
  properties:
    verified-domain-name:
      type: string
projections:
  - boundedContext: organization-identity
    aggregate: domain-linkage
    event: domain-registered
    rule: Register declared domain name.
  - boundedContext: organization-identity
    aggregate: domain-linkage
    event: linkage-verified
    rule: Record verified domain linkage timestamp.
---
apiVersion: schema.esdm.io/core/v1
kind: query
name: get-verified-domains
description: Queries registered and verified DNS domains.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
readModel: verified-domains
paradigm: document
result:
  type: object
  properties:
    verified-domain-name:
      type: string
parameters:
  type: object
actors:
  - public
---
# ==============================================================================
# Bounded Context 2: Open Federation
# ==============================================================================
apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: open-federation
description: Manages OpenID Federation 1.0 trust anchors, entity statements, invitations, and hierarchical trust chain validation.
scope:
  domain: digital-identity-ecosystem
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: federation-operator
description: Authority operator managing trust anchors and federation membership criteria.
scope:
  domain: digital-identity-ecosystem
  boundedContext: open-federation
type: human
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: public
description: Unauthenticated participant resolving federation entity configurations.
scope:
  domain: digital-identity-ecosystem
  boundedContext: open-federation
type: human
---
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: trust-anchor
description: Root federation authority establishing trust frameworks and admitting member entities.
scope:
  domain: digital-identity-ecosystem
  boundedContext: open-federation
identifiedBy:
  source: generated
  generator: uuid
state:
  type: object
  properties:
    federation-id:
      type: string
    trust-mark-id:
      type: string
    active-members-count:
      type: integer
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: initialize-ecosystem
description: Bootstraps an OpenID Federation 1.0 trust anchor and publishes its root entity configuration.
actors: [federation-operator]
scope:
  domain: digital-identity-ecosystem
  boundedContext: open-federation
  aggregate: trust-anchor
data:
  type: object
  properties:
    federation-id:
      type: string
    trust-mark-id:
      type: string
  required: [federation-id, trust-mark-id]
publishes:
  - ecosystem-initialized
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: ecosystem-initialized
description: Emitted when an OpenID Federation ecosystem trust anchor is established.
scope:
  domain: digital-identity-ecosystem
  boundedContext: open-federation
  aggregate: trust-anchor
data:
  type: object
  properties:
    federation-id:
      type: string
    trust-mark-id:
      type: string
  required: [federation-id, trust-mark-id]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: admit-federation-member
description: Admits a participant organization into the federation and signs its subordinate entity statement.
actors: [federation-operator]
scope:
  domain: digital-identity-ecosystem
  boundedContext: open-federation
  aggregate: trust-anchor
data:
  type: object
  properties:
    id:
      type: string
      format: uuid
    member-did:
      type: string
    entity-type:
      type: string
  required: [id, member-did, entity-type]
publishes:
  - federation-member-admitted
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: federation-member-admitted
description: Emitted when an entity is admitted to the federation with an issued subordinate statement.
scope:
  domain: digital-identity-ecosystem
  boundedContext: open-federation
  aggregate: trust-anchor
data:
  type: object
  properties:
    member-did:
      type: string
    entity-type:
      type: string
  required: [member-did, entity-type]
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: federation-directory
description: Directory of verified organizations and issuers recognized within the federation.
scope:
  domain: digital-identity-ecosystem
  boundedContext: open-federation
schema:
  type: object
  properties:
    federation-id:
      type: string
    members-count:
      type: integer
projections:
  - boundedContext: open-federation
    aggregate: trust-anchor
    event: ecosystem-initialized
    rule: Initialize directory with federation identifier and zero members.
  - boundedContext: open-federation
    aggregate: trust-anchor
    event: federation-member-admitted
    rule: Increment members-count upon new member admission.
---
apiVersion: schema.esdm.io/core/v1
kind: query
name: get-federation-directory
description: Returns all certified members and entity statements within the OpenID Federation.
scope:
  domain: digital-identity-ecosystem
  boundedContext: open-federation
readModel: federation-directory
paradigm: document
result:
  type: object
  properties:
    federation-id:
      type: string
    members-count:
      type: integer
parameters:
  type: object
  properties:
    entity-type-filter:
      type: string
actors:
  - public
---
# ==============================================================================
# Bounded Context 3: Credential Issuance
# ==============================================================================
apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: credential-issuance
description: Manages credential templates, OID4VCI issuance sessions, DPoP key binding, and IETF Token Status Lists.
scope:
  domain: digital-identity-ecosystem
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: issuer-admin
description: Staff member or automated system authoring credential templates and supervising issuance.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
type: human
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: public
description: Unauthenticated wallet or verifier discovering credential issuer metadata and status lists.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
type: human
---
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: credential-template
description: Reusable credential definition specifying claims schema, display labels, and status list partitioning.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
identifiedBy:
  source: generated
  generator: uuid
state:
  type: object
  properties:
    template-id:
      type: string
    name:
      type: string
    schema-uri:
      type: string
    is-active:
      type: boolean
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: create-template
description: Defines a new credential template schema and activates it for issuance.
actors: [issuer-admin]
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: credential-template
data:
  type: object
  properties:
    name:
      type: string
    schema-uri:
      type: string
  required: [name, schema-uri]
publishes:
  - template-created
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: template-created
description: Emitted when a new credential template is created and ready for issuance sessions.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: credential-template
data:
  type: object
  properties:
    template-id:
      type: string
    name:
      type: string
    schema-uri:
      type: string
  required: [template-id, name, schema-uri]
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: template-catalog
description: Catalog of all authored and active credential templates.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
schema:
  type: object
  properties:
    total-templates:
      type: integer
projections:
  - boundedContext: credential-issuance
    aggregate: credential-template
    event: template-created
    rule: Increment total-templates count.
---
apiVersion: schema.esdm.io/core/v1
kind: query
name: get-template-catalog
description: Queries available credential templates.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
readModel: template-catalog
paradigm: document
result:
  type: object
  properties:
    total-templates:
      type: integer
parameters:
  type: object
actors:
  - public
---
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: issuance-session
description: Lifecycle aggregate tracking an individual OID4VCI transaction from offer to issuance.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
identifiedBy:
  source: generated
  generator: uuid
state:
  type: object
  properties:
    session-id:
      type: string
    template-id:
      type: string
    holder-did:
      type: string
    holder-binding-key:
      type: string
    status:
      type: string
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: create-offer
description: Creates an OID4VCI credential offer containing pre-authorized code and issuer endpoint.
actors: [issuer-admin]
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: issuance-session
data:
  type: object
  properties:
    template-id:
      type: string
    holder-did:
      type: string
  required: [template-id, holder-did]
publishes:
  - offer-created
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: offer-created
description: Emitted when an OID4VCI credential offer is initialized for a recipient holder.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: issuance-session
data:
  type: object
  properties:
    session-id:
      type: string
    template-id:
      type: string
    holder-did:
      type: string
  required: [session-id, template-id, holder-did]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: submit-binding-proof
description: Validates holder's DPoP proof-of-possession and registers their binding key.
actors: [issuer-admin]
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: issuance-session
data:
  type: object
  properties:
    id:
      type: string
      format: uuid
    holder-binding-key:
      type: string
    dpop-proof:
      type: string
  required: [id, holder-binding-key, dpop-proof]
publishes:
  - binding-proof-accepted
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: binding-proof-accepted
description: Emitted when holder cryptographically proves control over their subject binding key.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: issuance-session
data:
  type: object
  properties:
    session-id:
      type: string
    holder-binding-key:
      type: string
  required: [session-id, holder-binding-key]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: issue-credential
description: Signs and issues the verifiable credential with an assigned status list index.
actors: [issuer-admin]
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: issuance-session
data:
  type: object
  properties:
    id:
      type: string
      format: uuid
    credential-payload:
      type: string
    status-list-index:
      type: integer
  required: [id, credential-payload, status-list-index]
publishes:
  - credential-issued
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: credential-issued
description: Emitted when the signed verifiable credential payload is delivered to the holder.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: issuance-session
data:
  type: object
  properties:
    session-id:
      type: string
    credential-payload:
      type: string
    status-list-index:
      type: integer
  required: [session-id, credential-payload, status-list-index]
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: issuance-activity-view
description: Read model summarizing all active and completed issuance sessions.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
schema:
  type: object
  properties:
    total-offers:
      type: integer
    total-issued:
      type: integer
projections:
  - boundedContext: credential-issuance
    aggregate: issuance-session
    event: offer-created
    rule: Increment total-offers count.
  - boundedContext: credential-issuance
    aggregate: issuance-session
    event: credential-issued
    rule: Increment total-issued count.
  - boundedContext: credential-issuance
    aggregate: issuance-session
    event: binding-proof-accepted
    rule: Record successful DPoP proof verification for session.
---
apiVersion: schema.esdm.io/core/v1
kind: query
name: get-issuance-activity
description: Retrieves summary statistics of issuance sessions and delivered credentials.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
readModel: issuance-activity-view
paradigm: document
result:
  type: object
  properties:
    total-offers:
      type: integer
    total-issued:
      type: integer
parameters:
  type: object
  properties:
    status-filter:
      type: string
actors:
  - issuer-admin
---
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: token-status-list
description: IETF Token Status List bitstring aggregate for tracking credential revocation statuses.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
identifiedBy:
  source: generated
  generator: uuid
state:
  type: object
  properties:
    status-list-id:
      type: string
    bitstring-size:
      type: integer
    revoked-count:
      type: integer
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: create-status-list
description: Allocates a new IETF Token Status List bitstring partition.
actors: [issuer-admin]
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: token-status-list
data:
  type: object
  properties:
    status-list-id:
      type: string
    bitstring-size:
      type: integer
  required: [status-list-id, bitstring-size]
publishes:
  - status-list-created
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: status-list-created
description: Emitted when a new token status list partition is initialized.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: token-status-list
data:
  type: object
  properties:
    status-list-id:
      type: string
    bitstring-size:
      type: integer
  required: [status-list-id, bitstring-size]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: revoke-credential-index
description: Flips the status bit at the specified index to indicate credential revocation.
actors: [issuer-admin]
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: token-status-list
data:
  type: object
  properties:
    id:
      type: string
      format: uuid
    index:
      type: integer
    reason:
      type: string
  required: [id, index, reason]
publishes:
  - credential-index-revoked
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: credential-index-revoked
description: Emitted when a credential's status bit is set to revoked in the bitstring.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: token-status-list
data:
  type: object
  properties:
    status-list-id:
      type: string
    index:
      type: integer
    reason:
      type: string
  required: [status-list-id, index, reason]
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: token-status-lists
description: Summary of active status lists and revocation metrics.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
schema:
  type: object
  properties:
    total-status-lists:
      type: integer
projections:
  - boundedContext: credential-issuance
    aggregate: token-status-list
    event: status-list-created
    rule: Increment total status lists count.
  - boundedContext: credential-issuance
    aggregate: token-status-list
    event: credential-index-revoked
    rule: Record credential revocation index in status list.
---
apiVersion: schema.esdm.io/core/v1
kind: query
name: get-status-lists
description: Retrieves summary of token status lists.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
readModel: token-status-lists
paradigm: document
result:
  type: object
  properties:
    total-status-lists:
      type: integer
parameters:
  type: object
actors:
  - public
---
# ==============================================================================
# Bounded Context 4: Verification Service
# ==============================================================================
apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: verification-service
description: Manages OID4VP verification flows, challenge nonces, and cryptographic validation of presented credentials.
scope:
  domain: digital-identity-ecosystem
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: verifier-admin
description: Relying party administrator defining verification requirements and reviewing outcomes.
scope:
  domain: digital-identity-ecosystem
  boundedContext: verification-service
type: human
---
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: verification-flow
description: Reusable presentation definition rulebook specifying required credential schemas and allowed trust anchors.
scope:
  domain: digital-identity-ecosystem
  boundedContext: verification-service
identifiedBy:
  source: generated
