  domain: digital-identity-ecosystem
deliveryGuarantee: at-least-once
idempotency:
  owner: downstream
handles:
  - boundedContext: credential-issuance
    aggregate: issuance-session
    event: credential-issued
emits:
  - boundedContext: identity-wallet
    aggregate: wallet-vault
    command: store-credential
