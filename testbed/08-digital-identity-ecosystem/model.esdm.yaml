apiVersion: schema.esdm.io/core/v1
kind: policy
name: wallet-presentation-to-verifier-policy
description: Dispatches presentation verification in the relying party once user authorizes disclosure.
scope:
  domain: digital-identity-ecosystem
deliveryGuarantee: at-least-once
idempotency:
  owner: downstream
handles:
  - boundedContext: identity-wallet
    aggregate: presentation-exchange
    event: presentation-authorized
emits:
  - boundedContext: verification-service
    aggregate: verification-session
    command: verify-presentation
---
apiVersion: schema.esdm.io/core/v1
kind: policy
name: federation-admission-to-verifier-policy
description: Registers verification flow requirements upon admission of a new federation member.
scope:
  domain: digital-identity-ecosystem
deliveryGuarantee: at-least-once
idempotency:
  owner: downstream
handles:
  - boundedContext: open-federation
    aggregate: trust-anchor
    event: federation-member-admitted
emits:
  - boundedContext: verification-service
    aggregate: verification-flow
    command: define-verification-flow
---
apiVersion: schema.esdm.io/core/v1
kind: policy
name: domain-linkage-to-peer-network-policy
description: Synchronizes public organization profile display name when a verified domain is registered.
scope:
  domain: digital-identity-ecosystem
deliveryGuarantee: at-least-once
idempotency:
  owner: downstream
handles:
  - boundedContext: organization-identity
    aggregate: domain-linkage
    event: domain-registered
emits:
  - boundedContext: peer-network
    aggregate: organization-profile
    command: update-profile
