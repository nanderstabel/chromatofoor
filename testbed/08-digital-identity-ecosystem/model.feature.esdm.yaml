apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: verification-session-feature
description: BDD acceptance tests for OID4VP presentation verification.
scope:
  domain: digital-identity-ecosystem
  boundedContext: verification-service
  aggregate: verification-session
scenarios:
  - name: verify-initiate-verification
    description: Initializing an OID4VP verification challenge produces verification-initiated with nonce.
    when:
      command: initiate-verification
      data:
        flow-id: "flow-kyc-check"
        nonce: "nonce-xyz-789"
    then:
      events:
        - event: verification-initiated
          data:
            session-id: "session-vp-001"
            flow-id: "flow-kyc-check"
            nonce: "nonce-xyz-789"

  - name: verify-verify-presentation
    description: Validating a presentation submission produces presentation-verified.
    given:
      - event: verification-initiated
        data:
          session-id: "session-vp-001"
          flow-id: "flow-kyc-check"
          nonce: "nonce-xyz-789"
    when:
      command: verify-presentation
      data:
        id: "00000000-0000-0000-0000-000000000001"
        verifiable-presentation: "eyJhbGciOi..."
        status-list-check-passed: true
    then:
      events:
        - event: presentation-verified
          data:
            session-id: "session-vp-001"
            verified-claims-count: 3

