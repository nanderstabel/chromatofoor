apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: wallet-vault-feature
description: BDD acceptance tests for holder wallet secure credential storage.
scope:
  domain: digital-identity-ecosystem
  boundedContext: identity-wallet
  aggregate: wallet-vault
scenarios:
  - name: verify-store-credential
    description: Committing a received credential produces credential-stored.
    when:
      command: store-credential
      data:
        credential-id: "vc-diploma-001"
        issuer-did: "did:web:university.example.edu"
        credential-payload: "eyJhbGciOi..."
    then:
      events:
        - event: credential-stored
          data:
            credential-id: "vc-diploma-001"
            issuer-did: "did:web:university.example.edu"

  - name: verify-delete-credential
    description: Deleting a stored credential produces credential-deleted.
    given:
      - event: credential-stored
        data:
          credential-id: "vc-diploma-001"
          issuer-did: "did:web:university.example.edu"
    when:
      command: delete-credential
      data:
        id: "00000000-0000-0000-0000-000000000001"
        credential-id: "vc-diploma-001"
        reason: "User requested deletion"
    then:
      events:
        - event: credential-deleted
          data:
            credential-id: "vc-diploma-001"

