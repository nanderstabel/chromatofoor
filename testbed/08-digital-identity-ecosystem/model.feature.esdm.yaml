apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: wallet-keychain-feature
description: BDD acceptance tests for sovereign did:jwk key derivation and self-attested credentials.
scope:
  domain: digital-identity-ecosystem
  boundedContext: identity-wallet
  aggregate: wallet-keychain
scenarios:
  - name: verify-generate-holder-key
    description: Generating a new keypair derives a did:jwk identifier and emits holder-key-generated.
    when:
      command: generate-holder-key
      data:
        did-method: "did:jwk"
        algorithm: "Ed25519"
    then:
      events:
        - event: holder-key-generated
          data:
            holder-did: "did:jwk:eyJrdHkiOiJPS1AiLCJjcnYiOiJFZDI1NTE5In0"
            algorithm: "Ed25519"

  - name: verify-issue-self-signed-credential
    description: Producing a self-attested credential emits self-signed-credential-issued.
    given:
      - event: holder-key-generated
        data:
          holder-did: "did:jwk:eyJrdHkiOiJPS1AiLCJjcnYiOiJFZDI1NTE5In0"
          algorithm: "Ed25519"
    when:
      command: issue-self-signed-credential
      data:
        id: "00000000-0000-0000-0000-000000000001"
        subject: "did:jwk:eyJrdHkiOiJPS1AiLCJjcnYiOiJFZDI1NTE5In0"
        claims-summary: "Emergency Contact Card"
    then:
      events:
        - event: self-signed-credential-issued
          data:
            credential-id: "self-vc-999"
            subject: "did:jwk:eyJrdHkiOiJPS1AiLCJjcnYiOiJFZDI1NTE5In0"

