---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: organization-keyring-feature
description: BDD acceptance tests for enterprise KMS signing key generation and rotation.
scope:
  domain: digital-identity-ecosystem
  boundedContext: organization-identity
  aggregate: organization-keyring
scenarios:
  - name: verify-generate-signing-key
    description: Generating a signing key produces signing-key-generated with algorithm and JWK.
    when:
      command: generate-signing-key
      data:
        algorithm: "Ed25519"
        purpose: "assertionMethod"
    then:
      events:
        - event: signing-key-generated
          data:
            key-id: "key-ed25519-01"
            algorithm: "Ed25519"
            public-key-jwk: "{\"kty\":\"OKP\",\"crv\":\"Ed25519\",\"x\":\"12345\"}"

  - name: verify-rotate-signing-key
    description: Rotating a key produces signing-key-rotated deactivating previous key.
    given:
      - event: signing-key-generated
        data:
          key-id: "key-ed25519-01"
          algorithm: "Ed25519"
          public-key-jwk: "{\"kty\":\"OKP\",\"crv\":\"Ed25519\",\"x\":\"12345\"}"
    when:
      command: rotate-signing-key
      data:
        id: "00000000-0000-0000-0000-000000000001"
        new-algorithm: "ES256"
        reason: "Scheduled quarterly rotation"
    then:
      events:
        - event: signing-key-rotated
          data:
            previous-key-id: "key-ed25519-01"
            new-key-id: "key-es256-02"

---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: issuance-session-feature
description: BDD acceptance tests for the OID4VCI issuance session lifecycle.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: issuance-session
scenarios:
  - name: verify-create-offer
    description: Initiating an issuance session produces offer-created.
    when:
      command: create-offer
      data:
        template-id: "tpl-university-diploma"
        holder-did: "did:jwk:holder123"
    then:
      events:
        - event: offer-created
          data:
            session-id: "session-oid4vci-999"
            template-id: "tpl-university-diploma"
            holder-did: "did:jwk:holder123"

  - name: verify-submit-binding-proof
    description: Submitting DPoP binding proof produces binding-proof-accepted.
    given:
      - event: offer-created
        data:
          session-id: "session-oid4vci-999"
          template-id: "tpl-university-diploma"
          holder-did: "did:jwk:holder123"
    when:
      command: submit-binding-proof
      data:
        id: "00000000-0000-0000-0000-000000000001"
        holder-binding-key: "did:jwk:holder123#key-1"
        dpop-proof: "eyJhbGciOiJFZERTQ..."
    then:
      events:
        - event: binding-proof-accepted
          data:
            session-id: "session-oid4vci-999"
            holder-binding-key: "did:jwk:holder123#key-1"

  - name: verify-issue-credential
    description: Delivering signed verifiable credential produces credential-issued with status list index.
    given:
      - event: offer-created
        data:
          session-id: "session-oid4vci-999"
          template-id: "tpl-university-diploma"
          holder-did: "did:jwk:holder123"
      - event: binding-proof-accepted
        data:
          session-id: "session-oid4vci-999"
          holder-binding-key: "did:jwk:holder123#key-1"
    when:
      command: issue-credential
      data:
        id: "00000000-0000-0000-0000-000000000001"
        credential-payload: "eyJhbGciOiJSUzI1NiIs..."
        status-list-index: 42
    then:
      events:
        - event: credential-issued
          data:
            session-id: "session-oid4vci-999"
            credential-payload: "eyJhbGciOiJSUzI1NiIs..."
            status-list-index: 42

---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: token-status-list-feature
description: BDD acceptance tests for IETF Token Status List creation and revocation bit flipping.
scope:
  domain: digital-identity-ecosystem
  boundedContext: credential-issuance
  aggregate: token-status-list
scenarios:
  - name: verify-create-status-list
    description: Allocating a status list bitstring emits status-list-created.
    when:
      command: create-status-list
      data:
        status-list-id: "status-list-2026-v1"
        bitstring-size: 131072
    then:
      events:
        - event: status-list-created
          data:
            status-list-id: "status-list-2026-v1"
            bitstring-size: 131072

  - name: verify-revoke-credential-index
    description: Revoking an index flips bit and emits credential-index-revoked.
    given:
      - event: status-list-created
        data:
          status-list-id: "status-list-2026-v1"
          bitstring-size: 131072
    when:
      command: revoke-credential-index
      data:
        id: "00000000-0000-0000-0000-000000000001"
        index: 42
        reason: "Subject graduated and degree upgraded"
    then:
      events:
        - event: credential-index-revoked
          data:
            status-list-id: "status-list-2026-v1"
            index: 42
            reason: "Subject graduated and degree upgraded"

