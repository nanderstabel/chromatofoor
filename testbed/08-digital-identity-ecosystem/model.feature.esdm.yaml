apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: wallet-vault-read-model-feature
description: BDD acceptance tests verifying that wallet vault projections reflect stored and deleted credentials.
scope:
  domain: digital-identity-ecosystem
  boundedContext: identity-wallet
  readModel: wallet-vault-view
scenarios:
  - name: verify-wallet-vault-projection
    description: Storing a credential increments total-credentials count in the read model.
    given:
      - boundedContext: identity-wallet
        aggregate: wallet-vault
        event: credential-stored
        data:
          credential-id: "vc-diploma-001"
          issuer-did: "did:web:university.example.edu"
    when:
      query: get-wallet-vault
      parameters: {}
    then:
      readModel:
        total_credentials: 1
