# ==============================================================================
# Domain Story 3: Organization Discovery & Peer Connection
# ==============================================================================
apiVersion: schema.esdm.io/domain-storytelling/v1
kind: domain-story
name: organization-discovery-and-peer-connection
description: An SSI Agent discovers another organization via WebFinger, validates their domain linkage and linked presentations, and establishes an active peer connection.
scope:
  domain: digital-identity-ecosystem
pointInTime: to-be
granularity: fine-grained
domainPurity: digitalized

groups:
  - name: initiating-agent-boundary
    description: Organization initiating contact
  - name: target-agent-boundary
    description: Counterparty organization being discovered and verified

actors:
  - name: initiator-agent
    annotation: "SSI Agent seeking peer connection"
    groups: [initiating-agent-boundary]
  - name: counterparty-agent
    annotation: "Target SSI Agent responding to discovery"
    groups: [target-agent-boundary]

sentences:
  - sequenceNumber: 1
    workObjects:
      - name: webfinger-query
        annotation: "Resource query targeting /.well-known/webfinger?resource=acct:org@example.com"
        groups: [initiating-agent-boundary]
    edges:
      - from: { actor: initiator-agent }
        to: { workObject: webfinger-query }
        label: "dispatches"
      - from: { workObject: webfinger-query }
        to: { actor: counterparty-agent }
        label: "resolves at"

  - sequenceNumber: 2
    workObjects:
      - name: webfinger-descriptor
        annotation: "JRD response containing did:web URI and ActivityPub actor profile URL"
        groups: [target-agent-boundary]
    edges:
      - from: { actor: counterparty-agent }
        to: { workObject: webfinger-descriptor }
        label: "returns"
      - from: { workObject: webfinger-descriptor }
        to: { actor: initiator-agent }
        label: "parses"

  - sequenceNumber: 3
    workObjects:
      - name: linked-verifiable-presentations
        annotation: "Publicly hosted VPs showcasing certifications and accredited partner status"
        groups: [target-agent-boundary]
    edges:
      - from: { actor: counterparty-agent }
        to: { workObject: linked-verifiable-presentations }
        label: "hosts on public profile"
      - from: { actor: initiator-agent }
        to: { workObject: linked-verifiable-presentations }
        label: "verifies signatures and trust chains of"

  - sequenceNumber: 4
    workObjects:
      - name: peer-connection-record
        annotation: "Verified counterparty profile in enterprise address book"
        groups: [initiating-agent-boundary]
    edges:
      - from: { actor: initiator-agent }
        to: { workObject: peer-connection-record }
        label: "creates verified connection"

