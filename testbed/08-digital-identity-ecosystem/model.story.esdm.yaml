# ==============================================================================
# Domain Story 1: Organization Onboarding & Domain Linkage
# ==============================================================================
apiVersion: schema.esdm.io/domain-storytelling/v1
kind: domain-story
name: organization-onboarding-and-domain-linkage
description: An organization initializes its SSI Agent node, generates cryptographic signing keys, produces its did:web document, and establishes verifiable Domain Linkage.
scope:
  domain: digital-identity-ecosystem
pointInTime: to-be
granularity: fine-grained
domainPurity: digitalized

groups:
  - name: organization-boundary
    description: Enterprise perimeter and internal administration systems
  - name: dns-infrastructure
    description: Public DNS and web hosting infrastructure

actors:
  - name: organization-admin
    annotation: "Corporate identity administrator"
    groups: [organization-boundary]
  - name: ssi-agent
    annotation: "Enterprise SSI Agent node managing cryptographic identity"
    groups: [organization-boundary]
  - name: web-server
    annotation: "Public web server hosting /.well-known endpoints"
    groups: [dns-infrastructure]

sentences:
  - sequenceNumber: 1
    workObjects:
      - name: onboarding-request
        annotation: "Contains organization legal name, domain hostname, and key algorithm preferences"
        groups: [organization-boundary]
    edges:
      - from: { actor: organization-admin }
        to: { workObject: onboarding-request }
        label: "submits"
      - from: { workObject: onboarding-request }
        to: { actor: ssi-agent }
        label: "initializes"

  - sequenceNumber: 2
    workObjects:
      - name: signing-keypair
        annotation: "Ed25519 or ES256 cryptographic keys generated in KMS"
        groups: [organization-boundary]
    edges:
      - from: { actor: ssi-agent }
        to: { workObject: signing-keypair }
        label: "generates and registers"

  - sequenceNumber: 3
    workObjects:
      - name: did-web-document
        annotation: "W3C DID document declaring assertionMethod and authentication keys"
        groups: [organization-boundary]
    edges:
      - from: { actor: ssi-agent }
        to: { workObject: did-web-document }
        label: "constructs for domain"

  - sequenceNumber: 4
    workObjects:
      - name: domain-linkage-credential
        annotation: "Self-issued Verifiable Credential binding did:web to DNS domain origin"
        groups: [organization-boundary]
    edges:
      - from: { actor: ssi-agent }
        to: { workObject: domain-linkage-credential }
        label: "signs with organization key"

  - sequenceNumber: 5
    workObjects:
      - name: did-configuration-resource
        annotation: "JSON resource published at /.well-known/did-configuration.json"
        groups: [dns-infrastructure]
    edges:
      - from: { actor: ssi-agent }
        to: { workObject: did-configuration-resource }
        label: "packages"
      - from: { workObject: did-configuration-resource }
        to: { actor: web-server }
        label: "publishes to"

  - sequenceNumber: 6
    edges:
      - from: { actor: ssi-agent }
        to: { actor: web-server }
        label: "verifies TLS and validates domain linkage credential"

---
# ==============================================================================
# Domain Story 2: Federation & Ecosystem Instantiation
# ==============================================================================
apiVersion: schema.esdm.io/domain-storytelling/v1
kind: domain-story
name: federation-and-ecosystem-instantiation
description: An SSI Agent instantiates an OpenID Federation 1.0 trust anchor, issues entity statements, invites peer organizations, and validates trust chains.
scope:
  domain: digital-identity-ecosystem
pointInTime: to-be
granularity: fine-grained
domainPurity: digitalized

groups:
  - name: trust-anchor-boundary
    description: Federation authority systems
  - name: member-boundary
    description: Prospective or participating federation member organizations

actors:
  - name: federation-lead-agent
    annotation: "SSI Agent acting as OpenID Federation Trust Anchor"
    groups: [trust-anchor-boundary]
  - name: prospective-member-agent
    annotation: "SSI Agent seeking to join the ecosystem"
    groups: [member-boundary]

sentences:
  - sequenceNumber: 1
    workObjects:
      - name: entity-configuration
        annotation: "Self-signed Entity Statement published at /.well-known/openid-federation"
        groups: [trust-anchor-boundary]
    edges:
      - from: { actor: federation-lead-agent }
        to: { workObject: entity-configuration }
        label: "publishes trust anchor metadata"

  - sequenceNumber: 2
    workObjects:
      - name: federation-invitation
        annotation: "Signed invitation token with onboarding endpoint and ecosystem rules"
        groups: [trust-anchor-boundary]
    edges:
      - from: { actor: federation-lead-agent }
        to: { workObject: federation-invitation }
        label: "dispatches"
      - from: { workObject: federation-invitation }
        to: { actor: prospective-member-agent }
        label: "received by"

  - sequenceNumber: 3
    workObjects:
      - name: member-entity-statement
        annotation: "Subordinate registration statement signed by applicant"
        groups: [member-boundary]
    edges:
      - from: { actor: prospective-member-agent }
        to: { workObject: member-entity-statement }
        label: "submits application to"
      - from: { workObject: member-entity-statement }
        to: { actor: federation-lead-agent }
        label: "evaluated by"

  - sequenceNumber: 4
    workObjects:
      - name: subordinate-statement-jwt
        annotation: "Authority-issued Entity Statement certifying membership and allowed grant types"
        groups: [trust-anchor-boundary]
    edges:
      - from: { actor: federation-lead-agent }
        to: { workObject: subordinate-statement-jwt }
        label: "signs and publishes for member"
      - from: { workObject: subordinate-statement-jwt }
        to: { actor: prospective-member-agent }
        label: "resolves into active trust chain"

