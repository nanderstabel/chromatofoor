# ==============================================================================
# Domain Story 4: Credential Template Definition & OID4VCI Issuance
# ==============================================================================
apiVersion: schema.esdm.io/domain-storytelling/v1
kind: domain-story
name: credential-template-definition-and-oid4vci-issuance
description: An issuer defines a Credential Template and issues a Verifiable Credential to an Identity Wallet using OID4VCI with Token Status List assignment.
scope:
  domain: digital-identity-ecosystem
pointInTime: to-be
granularity: fine-grained
domainPurity: digitalized

groups:
  - name: issuer-boundary
    description: Issuing enterprise systems
  - name: wallet-boundary
    description: Sovereign identity wallet on holder device

actors:
  - name: issuer-admin
    annotation: "Enterprise template author"
    groups: [issuer-boundary]
  - name: issuer-agent
    annotation: "Issuer SSI Agent handling OID4VCI endpoints"
    groups: [issuer-boundary]
  - name: wallet-holder
    annotation: "End-user receiving the credential"
    groups: [wallet-boundary]
  - name: identity-wallet
    annotation: "Holder wallet application"
    groups: [wallet-boundary]

sentences:
  - sequenceNumber: 1
    workObjects:
      - name: credential-template
        annotation: "Schema definition, localized display labels, and status list partitioning"
        groups: [issuer-boundary]
    edges:
      - from: { actor: issuer-admin }
        to: { workObject: credential-template }
        label: "defines and activates in"
      - from: { workObject: credential-template }
        to: { actor: issuer-agent }
        label: "registered with"

  - sequenceNumber: 2
    workObjects:
      - name: oid4vci-credential-offer
        annotation: "Offer URI containing pre-authorized code and issuer metadata endpoint"
        groups: [issuer-boundary]
    edges:
      - from: { actor: issuer-agent }
        to: { workObject: oid4vci-credential-offer }
        label: "generates"
      - from: { workObject: oid4vci-credential-offer }
        to: { actor: wallet-holder }
        label: "delivered via QR or deep link to"

  - sequenceNumber: 3
    edges:
      - from: { actor: wallet-holder }
        to: { actor: identity-wallet }
        label: "opens offer in"
      - from: { actor: identity-wallet }
        to: { workObject: oid4vci-credential-offer }
        label: "inspects issuer endpoint"

  - sequenceNumber: 4
    edges:
      - from: { actor: identity-wallet }
        to: { actor: issuer-agent }
        label: "fetches issuer metadata, validates domain linkage and OpenID federation trust"

  - sequenceNumber: 5
    workObjects:
      - name: holder-binding-key
        annotation: "Ed25519 keypair generated in hardware-backed keystore"
        groups: [wallet-boundary]
      - name: dpop-token-proof
        annotation: "DPoP signed proof demonstrating holder key binding"
        groups: [wallet-boundary]
    edges:
      - from: { actor: identity-wallet }
        to: { workObject: holder-binding-key }
        label: "generates"
      - from: { actor: identity-wallet }
        to: { workObject: dpop-token-proof }
        label: "signs with binding key"
      - from: { workObject: dpop-token-proof }
        to: { actor: issuer-agent }
        label: "submits in token request to"

  - sequenceNumber: 6
    workObjects:
      - name: verifiable-credential-jwt
        annotation: "Signed credential containing claims and assigned Token Status List index"
        groups: [issuer-boundary]
    edges:
      - from: { actor: issuer-agent }
        to: { workObject: dpop-token-proof }
        label: "verifies key binding proof"
      - from: { actor: issuer-agent }
        to: { workObject: verifiable-credential-jwt }
        label: "signs and returns"
      - from: { workObject: verifiable-credential-jwt }
        to: { actor: identity-wallet }
        label: "delivers to"

  - sequenceNumber: 7
    edges:
      - from: { actor: identity-wallet }
        to: { workObject: verifiable-credential-jwt }
        label: "stores in encrypted local vault"

---
# ==============================================================================
# Domain Story 5: OID4VP Verification Flow & Wallet Presentation
# ==============================================================================
apiVersion: schema.esdm.io/domain-storytelling/v1
kind: domain-story
name: oid4vp-verification-flow-and-wallet-presentation
description: A relying party defines a Verification Flow and requests claims via OID4VP; the wallet validates counterparty trust, prompts user consent, and presents proofs.
scope:
  domain: digital-identity-ecosystem
pointInTime: to-be
granularity: fine-grained
domainPurity: digitalized

groups:
  - name: verifier-boundary
    description: Relying party enterprise systems
  - name: wallet-boundary
    description: Holder wallet application and user

actors:
  - name: verifier-agent
    annotation: "Relying party SSI Agent issuing verification challenge"
    groups: [verifier-boundary]
  - name: wallet-holder
    annotation: "User reviewing presentation consent"
    groups: [wallet-boundary]
  - name: identity-wallet
    annotation: "Sovereign wallet holding credentials"
    groups: [wallet-boundary]

sentences:
  - sequenceNumber: 1
    workObjects:
      - name: oid4vp-authorization-request
        annotation: "Presentation definition with requested claims, client ID, and cryptographic nonce"
        groups: [verifier-boundary]
    edges:
      - from: { actor: verifier-agent }
        to: { workObject: oid4vp-authorization-request }
        label: "generates"
      - from: { workObject: oid4vp-authorization-request }
        to: { actor: wallet-holder }
        label: "transmits to"

  - sequenceNumber: 2
    edges:
      - from: { actor: wallet-holder }
        to: { actor: identity-wallet }
        label: "opens request in"
      - from: { actor: identity-wallet }
        to: { actor: verifier-agent }
        label: "resolves verifier client ID, domain linkage, and federation trust chain"

  - sequenceNumber: 3
    workObjects:
      - name: consent-dialog
        annotation: "User interface showing verifier trust badge, purpose, and requested attributes"
        groups: [wallet-boundary]
    edges:
      - from: { actor: identity-wallet }
        to: { workObject: consent-dialog }
        label: "displays verified identity in"
      - from: { actor: wallet-holder }
        to: { workObject: consent-dialog }
        label: "authorizes selective disclosure of claims"

  - sequenceNumber: 4
    workObjects:
      - name: verifiable-presentation-jwt
        annotation: "Disclosed claims signed with holder private binding key and verifier nonce"
        groups: [wallet-boundary]
    edges:
      - from: { actor: identity-wallet }
        to: { workObject: verifiable-presentation-jwt }
        label: "assembles and signs"
      - from: { workObject: verifiable-presentation-jwt }
        to: { actor: verifier-agent }
        label: "transmits to response endpoint of"

  - sequenceNumber: 5
    workObjects:
      - name: verification-outcome-record
        annotation: "Cryptographic verification result, issuer signature check, and freshness log"
        groups: [verifier-boundary]
    edges:
      - from: { actor: verifier-agent }
        to: { workObject: verifiable-presentation-jwt }
        label: "validates signature, holder key binding, and revocation status"
      - from: { actor: verifier-agent }
        to: { workObject: verification-outcome-record }
        label: "stores audited outcome"

---
# ==============================================================================
# Domain Story 6: Revocation via IETF Token Status List
# ==============================================================================
apiVersion: schema.esdm.io/domain-storytelling/v1
kind: domain-story
name: revocation-via-ietf-token-status-list
description: An issuer marks an issued credential as revoked by flipping its assigned index bit in an IETF Token Status List, which verifiers check during validation.
scope:
  domain: digital-identity-ecosystem
pointInTime: to-be
granularity: fine-grained
domainPurity: digitalized

groups:
  - name: issuer-boundary
    description: Credential issuing authority
  - name: verifier-boundary
    description: Relying party checking status

actors:
  - name: issuer-admin
    annotation: "Authorized officer initiating revocation"
    groups: [issuer-boundary]
  - name: issuer-agent
    annotation: "Issuer node managing status lists"
    groups: [issuer-boundary]
  - name: verifier-agent
    annotation: "Relying party agent evaluating presentation"
    groups: [verifier-boundary]

sentences:
  - sequenceNumber: 1
    workObjects:
      - name: revocation-command-order
        annotation: "Directive referencing credential identifier and reason code"
        groups: [issuer-boundary]
    edges:
      - from: { actor: issuer-admin }
        to: { workObject: revocation-command-order }
        label: "submits"
      - from: { workObject: revocation-command-order }
        to: { actor: issuer-agent }
        label: "processed by"

  - sequenceNumber: 2
    workObjects:
      - name: status-list-token
        annotation: "JWT containing compressed bitstring with bit updated from 0 to 1"
        groups: [issuer-boundary]
    edges:
      - from: { actor: issuer-agent }
        to: { workObject: status-list-token }
        label: "updates bit at assigned index and signs"

  - sequenceNumber: 3
    edges:
      - from: { actor: issuer-agent }
        to: { workObject: status-list-token }
        label: "hosts at public HTTPS status list URI"

  - sequenceNumber: 4
    edges:
      - from: { actor: verifier-agent }
        to: { workObject: status-list-token }
        label: "fetches and inspects bit at credential status index"

---
# ==============================================================================
# Domain Story 7: Wallet Self-Issued Credentials & Key Rotation
# ==============================================================================
apiVersion: schema.esdm.io/domain-storytelling/v1
kind: domain-story
name: wallet-self-issued-credentials-and-key-rotation
description: A wallet holder rotates device cryptographic keys, derives a did:jwk / did:key identifier, and generates a self-signed verifiable credential for personal claims.
scope:
  domain: digital-identity-ecosystem
pointInTime: to-be
granularity: fine-grained
domainPurity: digitalized

groups:
  - name: wallet-boundary
    description: Holder wallet application and device keystore

actors:
  - name: wallet-holder
    annotation: "Wallet user"
    groups: [wallet-boundary]
  - name: identity-wallet
    annotation: "Wallet application client"
    groups: [wallet-boundary]

sentences:
  - sequenceNumber: 1
    workObjects:
      - name: key-rotation-order
        annotation: "User directive to generate fresh signing key and retire previous key"
        groups: [wallet-boundary]
    edges:
      - from: { actor: wallet-holder }
        to: { workObject: key-rotation-order }
        label: "initiates"
      - from: { workObject: key-rotation-order }
        to: { actor: identity-wallet }
        label: "executes"

  - sequenceNumber: 2
    workObjects:
      - name: rotated-keypair
        annotation: "Newly derived Ed25519 or ES256 keypair in secure hardware"
        groups: [wallet-boundary]
      - name: did-jwk-identifier
        annotation: "Decentralized identifier computed directly from public key (did:jwk or did:key)"
        groups: [wallet-boundary]
    edges:
      - from: { actor: identity-wallet }
        to: { workObject: rotated-keypair }
        label: "generates"
      - from: { actor: identity-wallet }
        to: { workObject: did-jwk-identifier }
        label: "computes"

  - sequenceNumber: 3
    workObjects:
      - name: self-asserted-profile-data
        annotation: "Personal contact details, emergency info, or preferred nicknames"
        groups: [wallet-boundary]
      - name: self-signed-credential
        annotation: "Verifiable Credential where issuer DID equals subject DID"
        groups: [wallet-boundary]
    edges:
      - from: { actor: wallet-holder }
        to: { workObject: self-asserted-profile-data }
        label: "inputs into"
      - from: { actor: identity-wallet }
        to: { workObject: self-signed-credential }
        label: "assembles and signs with holder key"
