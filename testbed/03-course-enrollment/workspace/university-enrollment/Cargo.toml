[workspace]
resolver = "2"
members = [
    "bootstrap",
    "bounded-contexts/enrollment",
    "domain",
    "presentation/interactive-tui",
]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-test = "0.2"
chromatofoor = { path = "../../../../chromatofoor" }
chromatofoor-http = { path = "../../../../presentation/http" }
chromatofoor-graphql = { path = "../../../../presentation/graphql", features = ["axum"] }
chromatofoor-mcp = { path = "../../../../presentation/mcp", features = ["http"] }
chromatofoor-tui = { path = "../../../../presentation/tui" }
chromatofoor-tauri = { path = "../../../../presentation/tauri" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "warn"

[profile.dev.package."*"]
debug = false
