apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: residency-onboarding-flow
description: Behavioral specifications for the residency-onboarding process manager covering the cross-context lease verification workflow.
scope:
  domain: virtual-apartment
  processManager: residency-onboarding
scenarios:
  - name: starting-onboarding-on-lease-request
    description: When a household requests a lease, the process manager stores the details, sets status to verifying, and emits a verify-apartment command.
    given: []
    when:
      boundedContext: tenancy
      aggregate: household
      event: lease-requested
      data:
        household-id: "eeee0000-0000-0000-0000-000000000001"
        apartment-id: "dddd0000-0000-0000-0000-000000000001"
        start-date: "2026-08-01"
        end-date: "2027-07-31"
    then:
      emits:
        - boundedContext: property
          aggregate: apartment
          command: verify-apartment
          data:
            id: "dddd0000-0000-0000-0000-000000000001"
            household-id: "eeee0000-0000-0000-0000-000000000001"
      state:
        apartment-id: "dddd0000-0000-0000-0000-000000000001"
        start-date: "2026-08-01"
        end-date: "2027-07-31"
        status: "verifying"

  - name: completing-onboarding-on-verification
    description: When the apartment is verified, the process manager emits start-lease, sets status to accepted, and ends.
    given:
      - boundedContext: tenancy
        aggregate: household
        event: lease-requested
        data:
          household-id: "eeee0000-0000-0000-0000-000000000001"
          apartment-id: "dddd0000-0000-0000-0000-000000000001"
          start-date: "2026-08-01"
          end-date: "2027-07-31"
    when:
      boundedContext: property
      aggregate: apartment
      event: verified
      data:
        household-id: "eeee0000-0000-0000-0000-000000000001"
    then:
      emits:
        - boundedContext: tenancy
          aggregate: household
          command: start-lease
          data:
            id: "eeee0000-0000-0000-0000-000000000001"
            apartment-id: "dddd0000-0000-0000-0000-000000000001"
            start-date: "2026-08-01"
            end-date: "2027-07-31"
      state:
        apartment-id: "dddd0000-0000-0000-0000-000000000001"
        start-date: "2026-08-01"
        end-date: "2027-07-31"
        status: "accepted"
      ended: true
---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: apartment-inventory-projection
description: Behavioral specifications for the apartment-inventory read model verifying that projections correctly materialize apartment, room, container, and item data.
scope:
  domain: virtual-apartment
  boundedContext: property
  readModel: apartment-inventory
scenarios:
  - name: querying-empty-inventory
    description: With no events, the inventory query returns an empty list.
    given: []
    when:
      query: get-apartment-inventory
      parameters: {}
    then:
      result: []

  - name: querying-after-apartment-registered
    description: After an apartment is registered, the inventory includes it with empty rooms.
    given:
      - boundedContext: property
        aggregate: apartment
        event: registered
        data: {}
    when:
      query: get-apartment-inventory
      parameters: {}
    then:
      result:
        - rooms: []

  - name: querying-after-room-added
    description: After a room is added, the inventory shows the apartment with its room.
    given:
      - boundedContext: property
        aggregate: apartment
        event: registered
        data: {}
      - boundedContext: property
        aggregate: apartment
        event: room-added
        data:
          room-id: "b1c2d3e4-0000-0000-0000-000000000001"
          name: "Living Room"
          max-capacity: 5
    when:
      query: get-apartment-inventory
      parameters: {}
    then:
      result:
        - rooms:
