# ═══════════════════════════════════════════════════════════════════
# Given-When-Then Feature Specifications
# ═══════════════════════════════════════════════════════════════════
#
# Behavioral BDD-style scenarios using the given-when-then/v1
# extension schema. Each feature targets one consistency unit
# and covers happy-path, rejection, and edge-case scenarios.
# ═══════════════════════════════════════════════════════════════════

apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: apartment-lifecycle
description: Behavioral specifications for the apartment aggregate covering registration, room management, verification, and unregistration.
scope:
  domain: virtual-apartment
  boundedContext: property
  aggregate: apartment
scenarios:
  - name: registering-a-new-apartment
    description: A resident registers a brand-new apartment into the system.
    given: []
    when:
      command: register-apartment
      data: {}
      actor: resident
    then:
      events:
        - event: registered
          data: {}

  - name: adding-a-room-to-an-apartment
    description: After registration, a resident adds a room with a name and capacity.
    given:
      - event: registered
        data: {}
    when:
      command: add-room
      data:
        id: "a1b2c3d4-0000-0000-0000-000000000001"
        room-id: "b1c2d3e4-0000-0000-0000-000000000001"
        name: "Living Room"
        max-capacity: 5
      actor: resident
    then:
      events:
        - event: room-added
          data:
            room-id: "b1c2d3e4-0000-0000-0000-000000000001"
            name: "Living Room"
            max-capacity: 5

  - name: add-room-validation-fails
    description: Adding a room with 0 capacity fails validation.
    given:
      - event: registered
        data: {}
    when:
      command: add-room
      data:
        id: "a1b2c3d4-0000-0000-0000-000000000001"
        room-id: "b1c2d3e4-0000-0000-0000-000000000001"
        name: "Tiny Room"
        max-capacity: 0
      actor: resident
    then:
      rejection:
        reason: "max_capacity: Field 'max-capacity' must be at least 1"

  - name: removing-a-room-from-an-apartment
    description: A resident removes a previously added room.
    given:
      - event: registered
        data: {}
      - event: room-added
        data:
          room-id: "b1c2d3e4-0000-0000-0000-000000000001"
          name: "Living Room"
          max-capacity: 5
    when:
      command: remove-room
      data:
        id: "a1b2c3d4-0000-0000-0000-000000000001"
        room-id: "b1c2d3e4-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: room-removed
          data:
            room-id: "b1c2d3e4-0000-0000-0000-000000000001"

  - name: verifying-an-apartment-for-lease
    description: The system verifies an apartment exists so a lease can proceed.
    given:
      - event: registered
        data: {}
    when:
      command: verify-apartment
      data:
        id: "a1b2c3d4-0000-0000-0000-000000000001"
        household-id: "aaaa0000-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: verified
          data:
            household-id: "aaaa0000-0000-0000-0000-000000000001"

  - name: unregistering-an-apartment
    description: A resident removes an apartment from the system entirely.
    given:
      - event: registered
        data: {}
    when:
      command: unregister-apartment
      data:
        id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: unregistered
          data: {}
---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: household-lifecycle
description: Behavioral specifications for the household aggregate covering formation, resident management, and the full lease lifecycle.
scope:
  domain: virtual-apartment
  boundedContext: tenancy
  aggregate: household
scenarios:
  - name: forming-a-household
    description: A resident forms a new household to group members together.
    given: []
    when:
      command: form-household
      data: {}
      actor: resident
    then:
      events:
        - event: formed
          data: {}

  - name: adding-a-resident-to-household
    description: A resident is added to an existing household.
    given:
      - event: formed
        data: {}
    when:
      command: add-resident
      data:
        id: "eeee0000-0000-0000-0000-000000000001"
        resident-id: "cccc0000-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: resident-added
          data:
            resident-id: "cccc0000-0000-0000-0000-000000000001"

  - name: removing-a-resident-from-household
    description: A resident is removed from a household they previously joined.
    given:
      - event: formed
        data: {}
      - event: resident-added
        data:
          resident-id: "cccc0000-0000-0000-0000-000000000001"
    when:
      command: remove-resident
      data:
        id: "eeee0000-0000-0000-0000-000000000001"
        resident-id: "cccc0000-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: resident-removed
          data:
            resident-id: "cccc0000-0000-0000-0000-000000000001"

  - name: requesting-a-lease
    description: A household requests to lease a specific apartment for a date range.
    given:
      - event: formed
        data: {}
    when:
      command: request-lease
      data:
        id: "eeee0000-0000-0000-0000-000000000001"
        apartment-id: "dddd0000-0000-0000-0000-000000000001"
        start-date: "2026-08-01"
        end-date: "2027-07-31"
        household-id: "eeee0000-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: lease-requested
          data:
            household-id: "eeee0000-0000-0000-0000-000000000001"
            apartment-id: "dddd0000-0000-0000-0000-000000000001"
            start-date: "2026-08-01"
            end-date: "2027-07-31"

  - name: starting-a-lease-after-verification
    description: After the apartment is verified, the lease is officially started.
    given:
      - event: formed
        data: {}
      - event: lease-requested
        data:
          household-id: "eeee0000-0000-0000-0000-000000000001"
          apartment-id: "dddd0000-0000-0000-0000-000000000001"
          start-date: "2026-08-01"
          end-date: "2027-07-31"
    when:
      command: start-lease
      data:
        id: "eeee0000-0000-0000-0000-000000000001"
        apartment-id: "dddd0000-0000-0000-0000-000000000001"
        start-date: "2026-08-01"
        end-date: "2027-07-31"
      actor: resident
    then:
      events:
        - event: lease-started
          data:
            apartment-id: "dddd0000-0000-0000-0000-000000000001"
            start-date: "2026-08-01"
            end-date: "2027-07-31"

  - name: rejecting-a-lease
    description: A lease request is rejected because the apartment is unavailable.
    given:
      - event: formed
        data: {}
      - event: lease-requested
        data:
          household-id: "eeee0000-0000-0000-0000-000000000001"
          apartment-id: "dddd0000-0000-0000-0000-000000000001"
          start-date: "2026-08-01"
          end-date: "2027-07-31"
    when:
      command: reject-lease
      data:
        id: "eeee0000-0000-0000-0000-000000000001"
        reason: "Apartment is already occupied"
      actor: resident
    then:
      events:
        - event: lease-rejected
          data:
            reason: "Apartment is already occupied"

  - name: ending-a-lease
    description: A household ends its current active lease.
    given:
      - event: formed
        data: {}
      - event: lease-started
        data:
          apartment-id: "dddd0000-0000-0000-0000-000000000001"
          start-date: "2026-08-01"
          end-date: "2027-07-31"
    when:
      command: end-lease
      data:
        id: "eeee0000-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: lease-ended
          data: {}
---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: container-placement-enforcement
description: Behavioral specifications for the container-placement dynamic consistency boundary, enforcing room existence and capacity invariants.
scope:
  domain: virtual-apartment
  boundedContext: property
  dynamicConsistencyBoundary: container-placement
scenarios:
  - name: adding-container-to-existing-room
    description: A resident adds a bookshelf to a room that exists and has capacity.
    given:
      - boundedContext: property
        aggregate: apartment
        event: registered
        data:
          address:
            street: "123 Main St"
            city: "Metropolis"
            postal-code: "12345"
            country: "USA"
          door-bell:
            bell-id: "b1b2c3d4-0000-0000-0000-000000000001"
            melody: "ding-dong"
      - boundedContext: property
        aggregate: apartment
        event: room-added
        data:
          room-id: "b1c2d3e4-0000-0000-0000-000000000001"
          name: "Living Room"
          max-capacity: 5
    when:
      command: add-container
      data:
        container-id: "f1f20000-0000-0000-0000-000000000001"
        room-id: "b1c2d3e4-0000-0000-0000-000000000001"
        container-type: "bookshelf"
        max-capacity: 10
        apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: container-added
          data:
            container-id: "f1f20000-0000-0000-0000-000000000001"
            room-id: "b1c2d3e4-0000-0000-0000-000000000001"
            container-type: "bookshelf"
            max-capacity: 10
            apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"

  - name: rejecting-container-when-room-does-not-exist
    description: Adding a container to a non-existent room is rejected.
    given: []
    when:
      command: add-container
      data:
        container-id: "f1f20000-0000-0000-0000-000000000002"
        room-id: "b1c2d3e4-0000-0000-0000-000000000099"
        container-type: "dresser"
        max-capacity: 8
        apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      rejection:
        invariant: room-must-exist

  - name: rejecting-container-when-room-is-full
    description: Adding a container when the room has reached max-capacity is rejected.
    given:
      - boundedContext: property
        aggregate: apartment
        event: registered
        data:
          address:
            street: "123 Main St"
            city: "Metropolis"
            postal-code: "12345"
            country: "USA"
          door-bell:
            bell-id: "b1b2c3d4-0000-0000-0000-000000000001"
            melody: "ding-dong"
      - boundedContext: property
        aggregate: apartment
        event: room-added
        data:
          room-id: "b1c2d3e4-0000-0000-0000-000000000001"
          name: "Bathroom"
          max-capacity: 1
      - boundedContext: property
        event: container-added
        data:
          container-id: "f1f20000-0000-0000-0000-000000000001"
          room-id: "b1c2d3e4-0000-0000-0000-000000000001"
          container-type: "cabinet"
          max-capacity: 4
          apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
    when:
      command: add-container
      data:
        container-id: "f1f20000-0000-0000-0000-000000000002"
        room-id: "b1c2d3e4-0000-0000-0000-000000000001"
        container-type: "shelf"
        max-capacity: 3
        apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      rejection:
        invariant: room-capacity-not-exceeded

  - name: removing-a-container
    description: A resident removes a container from a room.
    given:
      - boundedContext: property
        aggregate: apartment
        event: registered
        data:
          address:
            street: "123 Main St"
            city: "Metropolis"
            postal-code: "12345"
            country: "USA"
          door-bell:
            bell-id: "b1b2c3d4-0000-0000-0000-000000000001"
            melody: "ding-dong"
      - boundedContext: property
        aggregate: apartment
        event: room-added
        data:
          room-id: "b1c2d3e4-0000-0000-0000-000000000001"
          name: "Bedroom"
          max-capacity: 5
      - boundedContext: property
        event: container-added
        data:
          container-id: "f1f20000-0000-0000-0000-000000000001"
          room-id: "b1c2d3e4-0000-0000-0000-000000000001"
          container-type: "wardrobe"
          max-capacity: 10
          apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
    when:
      command: remove-container
      data:
        container-id: "f1f20000-0000-0000-0000-000000000001"
        room-id: "b1c2d3e4-0000-0000-0000-000000000001"
        apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: container-removed
          data:
            container-id: "f1f20000-0000-0000-0000-000000000001"
            room-id: "b1c2d3e4-0000-0000-0000-000000000001"
            apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: item-placement-enforcement
description: Behavioral specifications for the item-placement dynamic consistency boundary, enforcing target existence and capacity invariants for both rooms and containers.
scope:
  domain: virtual-apartment
  boundedContext: property
  dynamicConsistencyBoundary: item-placement
scenarios:
  - name: placing-item-in-room
    description: A resident places a chair directly into a room with available capacity.
    given:
      - boundedContext: property
        aggregate: apartment
        event: registered
        data:
          address:
            street: "123 Main St"
            city: "Metropolis"
            postal-code: "12345"
            country: "USA"
          door-bell:
            bell-id: "b1b2c3d4-0000-0000-0000-000000000001"
            melody: "ding-dong"
      - boundedContext: property
        aggregate: apartment
        event: room-added
        data:
          room-id: "b1c2d3e4-0000-0000-0000-000000000001"
          name: "Kitchen"
          max-capacity: 5
    when:
      command: place-item
      data:
        item-id: "11110000-0000-0000-0000-000000000001"
        target-id: "b1c2d3e4-0000-0000-0000-000000000001"
        target-type: "room"
        item-type: "chair"
        apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: item-placed
          data:
            item-id: "11110000-0000-0000-0000-000000000001"
            target-id: "b1c2d3e4-0000-0000-0000-000000000001"
            target-type: "room"
            item-type: "chair"
            apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"

  - name: placing-item-in-container
    description: A resident places a book into a bookshelf container.
    given:
      - boundedContext: property
        event: container-added
        data:
          container-id: "f1f20000-0000-0000-0000-000000000001"
          room-id: "b1c2d3e4-0000-0000-0000-000000000001"
          container-type: "bookshelf"
          max-capacity: 10
          apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
    when:
      command: place-item
      data:
        item-id: "11110000-0000-0000-0000-000000000002"
        target-id: "f1f20000-0000-0000-0000-000000000001"
        target-type: "container"
        item-type: "book"
        apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: item-placed
          data:
            item-id: "11110000-0000-0000-0000-000000000002"
            target-id: "f1f20000-0000-0000-0000-000000000001"
            target-type: "container"
            item-type: "book"
            apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"

  - name: rejecting-item-when-target-does-not-exist
    description: Placing an item in a non-existent room is rejected.
    given: []
    when:
      command: place-item
      data:
        item-id: "11110000-0000-0000-0000-000000000003"
        target-id: "00000000-0000-0000-0000-000000000099"
        target-type: "room"
        item-type: "lamp"
        apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      rejection:
        invariant: target-must-exist

  - name: rejecting-item-when-target-is-full
    description: Placing an item in a room that has reached max-capacity is rejected.
    given:
      - boundedContext: property
        aggregate: apartment
        event: registered
        data:
          address:
            street: "123 Main St"
            city: "Metropolis"
            postal-code: "12345"
            country: "USA"
          door-bell:
            bell-id: "b1b2c3d4-0000-0000-0000-000000000001"
            melody: "ding-dong"
      - boundedContext: property
        aggregate: apartment
        event: room-added
        data:
          room-id: "b1c2d3e4-0000-0000-0000-000000000001"
          name: "Storage"
          max-capacity: 1
      - boundedContext: property
        event: item-placed
        data:
          item-id: "11110000-0000-0000-0000-000000000001"
          target-id: "b1c2d3e4-0000-0000-0000-000000000001"
          target-type: "room"
          item-type: "box"
          apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
    when:
      command: place-item
      data:
        item-id: "11110000-0000-0000-0000-000000000004"
        target-id: "b1c2d3e4-0000-0000-0000-000000000001"
        target-type: "room"
        item-type: "crate"
        apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      rejection:
        invariant: target-capacity-not-exceeded

  - name: moving-item-to-new-room
    description: A resident moves a chair from one room to another with available capacity.
    given:
      - boundedContext: property
        aggregate: apartment
        event: registered
        data:
          address:
            street: "123 Main St"
            city: "Metropolis"
            postal-code: "12345"
            country: "USA"
          door-bell:
            bell-id: "b1b2c3d4-0000-0000-0000-000000000001"
            melody: "ding-dong"
      - boundedContext: property
        aggregate: apartment
        event: room-added
        data:
          room-id: "b1c2d3e4-0000-0000-0000-000000000002"
          name: "Bedroom"
          max-capacity: 5
      - boundedContext: property
        event: item-placed
        data:
          item-id: "11110000-0000-0000-0000-000000000001"
          target-id: "b1c2d3e4-0000-0000-0000-000000000001"
          target-type: "room"
          item-type: "chair"
          apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
    when:
      command: move-item
      data:
        item-id: "11110000-0000-0000-0000-000000000001"
        target-id: "b1c2d3e4-0000-0000-0000-000000000002"
        target-type: "room"
        apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: item-moved
          data:
            item-id: "11110000-0000-0000-0000-000000000001"
            target-id: "b1c2d3e4-0000-0000-0000-000000000002"
            target-type: "room"
            apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"

  - name: removing-an-item
    description: A resident removes an item from the apartment entirely.
    given:
      - boundedContext: property
        event: item-placed
        data:
          item-id: "11110000-0000-0000-0000-000000000001"
          target-id: "b1c2d3e4-0000-0000-0000-000000000001"
          target-type: "room"
          item-type: "chair"
          apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
    when:
      command: remove-item
      data:
        item-id: "11110000-0000-0000-0000-000000000001"
        target-id: "b1c2d3e4-0000-0000-0000-000000000001"
        apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
      actor: resident
    then:
      events:
        - event: item-removed
          data:
            item-id: "11110000-0000-0000-0000-000000000001"
            target-id: "b1c2d3e4-0000-0000-0000-000000000001"
            apartment-id: "a1b2c3d4-0000-0000-0000-000000000001"
