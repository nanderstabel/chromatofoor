---
apiVersion: schema.esdm.io/core/v1
kind: event
name: unregistered
description: Emitted when an apartment is removed from the system.
scope:
  domain: virtual-apartment
  boundedContext: property
  aggregate: apartment
data: {}
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: add-room
