---
apiVersion: schema.esdm.io/core/v1
kind: domain
name: virtual-apartment
description: The core domain encompassing all features and operations of a virtual apartment complex.
---
apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: property
description: Manages the physical space, rooms, and items within an apartment.
scope:
  domain: virtual-apartment
ubiquitousLanguage:
  - term: Apartment
    definition: The physical unit that is managed and eventually leased. Consists of one or more rooms.
  - term: Room
    definition: A physical subdivision of an apartment. Rooms have capacity limits for items.
  - term: Container
    definition: A physical container like a closet or dresser that is placed in a room and holds items.
  - term: Item
    definition: A personal possession owned by a resident that occupies space within a room.
  - term: register-apartment
    definition: Registers a new apartment into the virtual apartment system.
  - term: registered
    definition: Emitted when an apartment is successfully registered.
  - term: add-container
    definition: Adds a container to a specific room, observing room capacity.
  - term: container-added
    definition: Emitted when a container is added to a room.
  - term: remove-container
    definition: Removes a container from a room.
  - term: container-removed
    definition: Emitted when a container is removed from a room.
  - term: verify-apartment
    definition: Verifies the existence of an apartment for cross-context processes.
  - term: verified
    definition: Emitted when an apartment has been successfully verified.
  - term: unregister-apartment
    definition: Removes an apartment from the system.
  - term: unregistered
    definition: Emitted when an apartment is removed from the system.
  - term: add-room
    definition: Adds a new room with a specified capacity to an apartment.
  - term: room-added
    definition: Emitted when a new room is added to an apartment.
  - term: remove-room
    definition: Removes a room from an apartment.
  - term: room-removed
    definition: Emitted when a room is removed from an apartment.
  - term: place-item
    definition: Places a new item into a specific room, observing room capacity.
  - term: item-placed
    definition: Emitted when an item is successfully placed into a room.
  - term: move-item
    definition: Moves an existing item to a new room, subject to capacity constraints.
  - term: item-moved
    definition: Emitted when an item is successfully moved to a new room.
  - term: remove-item
    definition: Removes an item from the apartment.
  - term: item-removed
    definition: Emitted when an item is removed from the apartment.
---
apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: tenancy
metadata:
  labels:
    tier: shared-kernel
description: Manages the residents, households, and their legal residency agreements (leases).
scope:
  domain: virtual-apartment
ubiquitousLanguage:
  - term: Household
    definition: A group of residents living together under a single active lease.
  - term: Resident
    definition: A human user who is part of a household and can initiate lease processes or manage items.
  - term: Lease
    definition: The agreement that binds a household to a specific apartment for a duration.
  - term: form-household
    definition: Forms a new household to group residents together.
  - term: formed
    definition: Emitted when a new household is successfully formed.
  - term: add-resident
    definition: Adds a resident to an existing household.
  - term: resident-added
    definition: Emitted when a resident is added to a household.
  - term: remove-resident
    definition: Removes a resident from a household.
  - term: resident-removed
    definition: Emitted when a resident is removed from a household.
  - term: request-lease
    definition: Submits a request for a household to lease an apartment.
  - term: lease-requested
    definition: Emitted when a household has requested a lease.
  - term: start-lease
    definition: Initiates a requested lease after the apartment has been verified.
  - term: lease-started
    definition: Emitted when a lease has officially started for a household.
  - term: reject-lease
    definition: Rejects a requested lease if the apartment is unavailable or verification fails.
  - term: lease-rejected
    definition: Emitted when a requested lease is rejected.
  - term: end-lease
    definition: Ends the current lease for a household.
  - term: lease-ended
    definition: Emitted when a lease is ended for a household.
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: resident
description: A human user who lives in or interacts with virtual apartments.
scope:
  domain: virtual-apartment
  boundedContext: property
type: human
---
apiVersion: schema.esdm.io/core/v1
