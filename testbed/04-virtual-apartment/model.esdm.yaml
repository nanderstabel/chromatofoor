---
apiVersion: schema.esdm.io/core/v1
kind: command
name: remove-room
description: Removes a room from an apartment.
scope:
  domain: virtual-apartment
  boundedContext: property
  aggregate: apartment
data:
  type: object
  properties:
    id:
      type: string
      format: uuid
    room-id:
      type: string
      format: uuid
  required: [id, room-id]
