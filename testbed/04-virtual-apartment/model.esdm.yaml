  - room-removed
actors:
  - resident
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: room-removed
description: Emitted when a room is removed from an apartment.
scope:
  domain: virtual-apartment
  boundedContext: property
  aggregate: apartment
data:
  type: object
  properties:
    room-id:
      type: string
      format: uuid
