  - boundedContext: tenancy
    aggregate: household
    event: resident-added
    rule: Add the resident to the household document.
  - boundedContext: tenancy
    aggregate: household
    event: resident-removed
    rule: Remove the resident from the household document.
  - boundedContext: tenancy
    aggregate: household
    event: lease-started
