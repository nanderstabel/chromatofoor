apiVersion: schema.esdm.io/core/v1
kind: process-manager
name: residency-onboarding
description: Orchestrates the cross-context workflow of requesting a lease, verifying the apartment's availability, and finalizing the lease.
scope:
  domain: virtual-apartment
deliveryGuarantee: at-least-once
idempotency:
  owner: self
correlatedBy:
  source: event-field
  field: household-id
state:
  type: object
  properties:
    apartment-id:
      type: string
      format: uuid
    start-date:
      type: string
      format: date
    end-date:
      type: string
      format: date
    status:
      type: string
      enum: [requested, verifying, accepted, rejected]
  required: [apartment-id, start-date, end-date, status]
invariants: []
constraints: []
startsWhen:
  - boundedContext: tenancy
    aggregate: household
    event: lease-requested
endsWhen:
  - name: lease-accepted
    condition: "The status is 'accepted'."
  - name: lease-rejected
    condition: "The status is 'rejected'."
reactions:
  - when:
      boundedContext: tenancy
      aggregate: household
      event: lease-requested
    rule: "Store the requested lease details in state, set status to 'verifying'."
    emits:
      - boundedContext: property
        aggregate: apartment
        command: verify-apartment
  - when:
      boundedContext: property
      aggregate: apartment
      event: verified
    rule: "Set status to 'accepted'."
    emits:
      - boundedContext: tenancy
        aggregate: household
        command: start-lease
