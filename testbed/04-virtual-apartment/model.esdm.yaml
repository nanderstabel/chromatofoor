---
apiVersion: schema.esdm.io/core/v1
kind: entity
name: container
description: A physical container like a closet or dresser that is placed in a room and holds items.
scope:
  domain: virtual-apartment
  boundedContext: property
schema:
  type: object
  properties:
    container-id:
      type: string
      format: uuid
    room-id:
      type: string
      format: uuid
    container-type:
      type: string
    max-capacity:
      type: integer
      minimum: 1
  required: [container-id, room-id, container-type, max-capacity]
identifiedBy:
  source: schema
  field: container-id
invariants: []
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: container-placement
description: A dynamic boundary spanning a container and its target room to enforce capacity constraints.
scope:
  domain: virtual-apartment
  boundedContext: property
identifiedBy:
  - name: container-id
    source: command-payload
    field: container-id
  - name: room-id
    source: command-payload
    field: room-id
consults:
  - boundedContext: property
    aggregate: apartment
    event: room-added
    criteria: Only the room-added event for the target room.
  - boundedContext: property
    aggregate: apartment
    event: room-removed
    criteria: Only the room-removed event for the target room.
  - boundedContext: property
    event: container-added
    criteria: Any container-added event for this container, AND all container-added events for the target room.
  - boundedContext: property
    event: container-removed
    criteria: Any container-removed event for this container, AND all container-removed events for the target room.
  - boundedContext: property
    event: item-placed
    criteria: All item-placed events for the target room.
  - boundedContext: property
    event: item-moved
    criteria: All item-moved events moving items into or out of the target room.
  - boundedContext: property
    event: item-removed
    criteria: All item-removed events for the target room.
invariants:
  - name: room-must-exist
    rule: The target room must exist (a room-added event must have been observed, and no room-removed event).
  - name: container-not-removed
    rule: The container must not have been removed.
  - name: room-capacity-not-exceeded
    rule: The total number of containers and items directly in the room must be strictly less than its max-capacity.
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: add-container
description: Adds a container to a specific room, observing room capacity.
scope:
  domain: virtual-apartment
  boundedContext: property
  dynamicConsistencyBoundary: container-placement
data:
  type: object
  properties:
    container-id:
      type: string
      format: uuid
    room-id:
      type: string
      format: uuid
    container-type:
      type: string
    max-capacity:
      type: integer
      minimum: 1
    apartment-id:
      type: string
      format: uuid
  required: [container-id, room-id, container-type, max-capacity, apartment-id]
publishes:
  - container-added
actors:
  - resident
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: container-added
description: Emitted when a container is added to a room.
scope:
  domain: virtual-apartment
  boundedContext: property
data:
  type: object
  properties:
    container-id:
      type: string
      format: uuid
    room-id:
      type: string
      format: uuid
    container-type:
      type: string
    max-capacity:
      type: integer
      minimum: 1
    apartment-id:
      type: string
      format: uuid
  required: [container-id, room-id, container-type, max-capacity, apartment-id]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: remove-container
description: Removes a container from a room. All items inside must be removed first.
scope:
  domain: virtual-apartment
  boundedContext: property
  dynamicConsistencyBoundary: container-placement
data:
  type: object
  properties:
    container-id:
      type: string
      format: uuid
    room-id:
      type: string
      format: uuid
    apartment-id:
      type: string
      format: uuid
  required: [container-id, room-id, apartment-id]
publishes:
  - container-removed
actors:
  - resident
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: container-removed
description: Emitted when a container is removed from a room.
scope:
  domain: virtual-apartment
  boundedContext: property
data:
  type: object
  properties:
    container-id:
      type: string
      format: uuid
    room-id:
      type: string
      format: uuid
    apartment-id:
      type: string
      format: uuid
  required: [container-id, room-id, apartment-id]
---
apiVersion: schema.esdm.io/core/v1
kind: entity
name: item
description: A physical object belonging to a resident that can be placed in a room or container.
scope:
  domain: virtual-apartment
  boundedContext: property
schema:
  type: object
  properties:
    item-id:
      type: string
      format: uuid
    target-id:
      type: string
      format: uuid
    target-type:
      type: string
      enum: [room, container]
    item-type:
      type: string
  required: [item-id, target-id, target-type, item-type]
identifiedBy:
  source: schema
  field: item-id
invariants: []
---
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: item-placement
description: A dynamic boundary spanning an item and its target room or container to enforce placement constraints, such as capacity.
scope:
  domain: virtual-apartment
  boundedContext: property
identifiedBy:
  - name: apartment-id
    source: command-payload
    field: apartment-id
consults:
  - boundedContext: property
    aggregate: apartment
    event: room-added
    criteria: Only the room-added event for the target (if target-type is room).
  - boundedContext: property
    aggregate: apartment
    event: room-removed
    criteria: Only the room-removed event for the target (if target-type is room).
  - boundedContext: property
    event: container-added
    criteria: Only the container-added event for the target (if target-type is container), OR all container-added events for the target (if target-type is room).
  - boundedContext: property
    event: container-removed
    criteria: Only the container-removed event for the target (if target-type is container), OR all container-removed events for the target (if target-type is room).
  - boundedContext: property
    event: item-placed
    criteria: Any item-placed event for this item, AND all item-placed events for the target.
  - boundedContext: property
    event: item-moved
    criteria: Any item-moved event for this item, AND all item-moved events for the target.
  - boundedContext: property
    event: item-removed
    criteria: Any item-removed event for this item, AND all item-removed events for the target.
invariants:
  - name: target-must-exist
    rule: The target (room or container) must exist and not be removed.
  - name: item-not-removed
    rule: The item must not have been removed (no item-removed event for this item ID).
  - name: target-capacity-not-exceeded
    rule: The total number of items (and containers, if target is a room) currently in the target must be strictly less than its max-capacity.
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: place-item
description: Places a new item into a specific room or container, observing capacity.
scope:
  domain: virtual-apartment
  boundedContext: property
  dynamicConsistencyBoundary: item-placement
data:
  type: object
  properties:
    item-id:
      type: string
      format: uuid
    target-id:
      type: string
      format: uuid
    target-type:
      type: string
      enum: [room, container]
    item-type:
      type: string
    apartment-id:
      type: string
      format: uuid
  required: [apartment-id, item-id, target-id, target-type, item-type]
publishes:
  - item-placed
actors:
  - resident
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: item-placed
description: Emitted when an item is successfully placed into a room or container.
scope:
  domain: virtual-apartment
  boundedContext: property
data:
  type: object
  properties:
    item-id:
      type: string
      format: uuid
    target-id:
      type: string
      format: uuid
    target-type:
      type: string
      enum: [room, container]
    item-type:
      type: string
    apartment-id:
      type: string
      format: uuid
  required: [apartment-id, item-id, target-id, target-type, item-type]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: move-item
description: Moves an existing item to a new room or container, subject to capacity constraints.
scope:
  domain: virtual-apartment
  boundedContext: property
  dynamicConsistencyBoundary: item-placement
data:
  type: object
  properties:
    item-id:
      type: string
      format: uuid
    target-id:
      type: string
      format: uuid
    target-type:
      type: string
      enum: [room, container]
    apartment-id:
      type: string
      format: uuid
  required: [apartment-id, item-id, target-id, target-type]
publishes:
  - item-moved
actors:
  - resident
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: item-moved
description: Emitted when an item is successfully moved to a new room or container.
scope:
  domain: virtual-apartment
  boundedContext: property
data:
  type: object
  properties:
    item-id:
      type: string
      format: uuid
    target-id:
      type: string
      format: uuid
    target-type:
      type: string
      enum: [room, container]
    apartment-id:
      type: string
      format: uuid
  required: [apartment-id, item-id, target-id, target-type]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: remove-item
description: Removes an item from the apartment.
scope:
  domain: virtual-apartment
  boundedContext: property
  dynamicConsistencyBoundary: item-placement
data:
  type: object
  properties:
    item-id:
      type: string
      format: uuid
    target-id:
      type: string
      format: uuid
    apartment-id:
      type: string
      format: uuid
  required: [apartment-id, item-id, target-id]
publishes:
  - item-removed
actors:
  - resident
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: item-removed
description: Emitted when an item is removed from the apartment.
scope:
  domain: virtual-apartment
  boundedContext: property
data:
  type: object
  properties:
    item-id:
      type: string
      format: uuid
    target-id:
      type: string
      format: uuid
    apartment-id:
      type: string
      format: uuid
  required: [apartment-id, item-id, target-id]
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: apartment-inventory
description: A projected view of all apartments, their rooms, containers, and items.
scope:
  domain: virtual-apartment
  boundedContext: property
paradigm: document
schema:
  type: object
  properties:
    apartments:
      type: array
      items:
        type: object
projections:
  - boundedContext: property
    aggregate: apartment
    event: registered
    rule: Create a new apartment document.
  - boundedContext: property
    aggregate: apartment
    event: unregistered
    rule: Delete the apartment document.
  - boundedContext: property
    aggregate: apartment
    event: room-added
    rule: Add the room to the apartment document.
  - boundedContext: property
    aggregate: apartment
    event: room-removed
    rule: Remove the room from the apartment document.
  - boundedContext: property
    event: container-added
    rule: Add the container to the specified room in the apartment document.
  - boundedContext: property
    event: container-removed
    rule: Remove the container from the apartment document.
  - boundedContext: property
    event: item-placed
    rule: Add the item to the specified target (room or container) in the apartment document.
  - boundedContext: property
    event: item-moved
    rule: Move the item to the new target in the apartment document.
  - boundedContext: property
    event: item-removed
    rule: Remove the item from the apartment document.
---
