---
apiVersion: schema.esdm.io/core/v1
kind: domain
name: bank-account-example
description: "A simple isolated domain to test raw event sourcing throughput and projection speeds."
---
apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: finance
description: "Bounded context managing financial operations and account balances."
scope:
  domain: bank-account-example
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: customer
scope:
  domain: bank-account-example
  boundedContext: finance
type: human
description: A bank customer.
---
apiVersion: schema.esdm.io/core/v1
kind: actor
name: bank-teller
scope:
  domain: bank-account-example
  boundedContext: finance
type: human
description: A bank employee handling transactions.
---
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: account
description: "Bank account aggregate managing account state and transactions."
scope:
  domain: bank-account-example
  boundedContext: finance
identifiedBy:
  source: generated
  generator: uuid
state:
  type: object
  properties:
    owner-name:
      type: string
    balance:
      type: integer
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: open-account
description: "Opens a new bank account with an initial balance."
actors: [customer, bank-teller]
scope:
  domain: bank-account-example
  boundedContext: finance
  aggregate: account
publishes:
  - account-opened
data:
  properties:
    owner-name:
      type: string
      minLength: 2
    initial-balance:
      type: integer
      minimum: 0
  required: [owner-name, initial-balance]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: deposit-funds
description: "Deposits funds into an existing bank account."
actors: [customer, bank-teller]
scope:
  domain: bank-account-example
  boundedContext: finance
  aggregate: account
publishes:
  - funds-deposited
data:
  properties:
    id:
      type: string
      format: uuid
    amount:
      type: integer
      exclusiveMinimum: 0
  required: [id, amount]
---
apiVersion: schema.esdm.io/core/v1
kind: command
name: withdraw-funds
description: "Withdraws funds from an existing bank account."
actors: [customer, bank-teller]
scope:
  domain: bank-account-example
  boundedContext: finance
  aggregate: account
publishes:
  - funds-withdrawn
data:
  properties:
    id:
      type: string
      format: uuid
    amount:
      type: integer
      exclusiveMinimum: 0
  required: [id, amount]
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: account-opened
description: "Emitted when a new bank account has been opened."
scope:
  domain: bank-account-example
  boundedContext: finance
  aggregate: account
data:
  properties:
    owner-name:
      type: string
    balance:
      type: integer
  required: [owner-name, balance]
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: funds-deposited
description: "Emitted when funds have been deposited into a bank account."
scope:
  domain: bank-account-example
  boundedContext: finance
  aggregate: account
data:
  properties:
    amount:
      type: integer
    new-balance:
      type: integer
  required: [amount, new-balance]
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: funds-withdrawn
description: "Emitted when funds have been withdrawn from a bank account."
scope:
  domain: bank-account-example
  boundedContext: finance
  aggregate: account
data:
  properties:
    amount:
      type: integer
    new-balance:
      type: integer
  required: [amount, new-balance]
---
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: account-summary
description: "Summary view of account owner and current balance."
scope:
  domain: bank-account-example
  boundedContext: finance
schema:
  type: object
  properties:
    owner-name:
      type: string
    current-balance:
      type: integer
projections:
  - boundedContext: finance
    aggregate: account
    event: account-opened
    rule: "Set owner-name and current-balance from the event."
  - boundedContext: finance
    aggregate: account
    event: funds-deposited
    rule: "Add amount to current-balance."
  - boundedContext: finance
    aggregate: account
    event: funds-withdrawn
    rule: "Subtract amount from current-balance."
---
apiVersion: schema.esdm.io/core/v1
kind: query
name: get-account-summary
description: Retrieves the current balance and owner details.
scope:
  domain: bank-account-example
  boundedContext: finance
readModel: account-summary
paradigm: document
result:
  type: object
parameters:
  type: object
actors:
  - customer
constraints: []
