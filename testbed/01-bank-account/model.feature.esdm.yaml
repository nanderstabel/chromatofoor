apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: account-commands
description: Behavioral scenarios for opening, depositing into, and withdrawing from a bank account.
scope:
  domain: bank-account-example
  boundedContext: finance
  aggregate: account
scenarios:
  - name: open-new-account
    description: Opening an account emits account-opened with the initial balance.
    given: []
    when:
      actor: customer
      command: open-account
      data:
        owner-name: "Alice"
        initial-balance: 100
    then:
      events:
        - event: account-opened
          data:
            owner-name: "Alice"
            balance: 100

  - name: deposit-positive-amount
    description: Depositing a positive amount emits funds-deposited with the updated balance.
    given:
      - event: account-opened
        data:
          owner-name: "Alice"
          balance: 100
    when:
      actor: customer
      command: deposit-funds
      data:
        id: "00000000-0000-0000-0000-000000000001"
        amount: 50
    then:
      events:
        - event: funds-deposited
          data:
            amount: 50
            new-balance: 150

  - name: ignore-zero-amount-deposit
    description: Depositing zero funds is an idempotent no-op that emits zero events.
    given:
      - event: account-opened
        data:
          owner-name: "Alice"
          balance: 100
    when:
      actor: bank-teller
      command: deposit-funds
      data:
        id: "00000000-0000-0000-0000-000000000001"
        amount: 0
    then:
      events: []

  - name: reject-overdraft-withdrawal
    description: Withdrawing more than the current balance is rejected with insufficient-funds.
    given:
      - event: account-opened
        data:
          owner-name: "Alice"
          balance: 100
    when:
      actor: customer
      command: withdraw-funds
      data:
        id: "00000000-0000-0000-0000-000000000001"
        amount: 150
    then:
      rejection:
        invariant: insufficient-funds

  - name: reject-unauthorized-teller-withdrawal
    description: A bank teller attempting to withdraw customer funds is rejected by actor authorization.
    given:
      - event: account-opened
        data:
          owner-name: "Alice"
          balance: 100
    when:
      actor: bank-teller
      command: withdraw-funds
      data:
        id: "00000000-0000-0000-0000-000000000001"
        amount: 40
    then:
      rejection:
        reason: "not authorized"
---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: account-summary-queries
description: Read-model query scenarios for account balance summaries.
scope:
  domain: bank-account-example
  boundedContext: finance
  readModel: account-summary
scenarios:
  - name: return-projected-balance-after-transactions
    description: Querying get-account-summary returns the projected owner and balance after deposits and withdrawals.
    given:
      - boundedContext: finance
        aggregate: account
        event: account-opened
        data:
          owner-name: "Alice"
          balance: 100
      - boundedContext: finance
        aggregate: account
        event: funds-deposited
        data:
          amount: 50
          new-balance: 150
      - boundedContext: finance
        aggregate: account
        event: funds-withdrawn
        data:
          amount: 30
          new-balance: 120
    when:
      query: get-account-summary
      parameters: {}
    then:
      result:
        owner_name: "Alice"
        current_balance: 120
