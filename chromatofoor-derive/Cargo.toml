[package]
name = "chromatofoor-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
convert_case = { version = "0.11", default-features = false }
proc-macro2 = "1.0"
quote = "1.0"
serde_derive_internals = { version = "0.29", default-features = false }
syn = { version = "2.0", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "proc-macro", "extra-traits"] }

[lints]
workspace = true
