$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schema.esdm.io/extensions/strict-description/v1.yaml"
title: ESDM Strict Description Extension
description: >
  Extends the ESDM Core schema to mandate human-readable documentation 
  (`description`) on every document.

allOf:
  - $ref: "../core/v1.yaml"
  - required:
      - description
    properties:
      description:
        type: string
        minLength: 1
